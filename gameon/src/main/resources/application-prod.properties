# ============================================================
# GameOn - Production Profile
# Use: Deployed environment with external SQL Server
# Activate: --spring.profiles.active=prod or set SPRING_PROFILES_ACTIVE=prod
# ============================================================

# ===== Database (all values from environment variables) =====
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# ===== Connection Pool (tighter for production) =====
spring.datasource.hikari.minimum-idle=10
spring.datasource.hikari.maximum-pool-size=30

# ===== JPA =====
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.generate_statistics=false

# ===== Flyway =====
spring.flyway.enabled=true

# ===== Thymeleaf =====
spring.thymeleaf.cache=true

# ===== Logging (minimal for production) =====
logging.level.root=WARN
logging.level.com.gameon=INFO
logging.level.org.springframework.security=WARN
logging.level.org.hibernate.SQL=WARN

# ===== Server =====
server.error.include-stacktrace=never
server.servlet.session.cookie.secure=true

# ===== Actuator (restricted in production) =====
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
