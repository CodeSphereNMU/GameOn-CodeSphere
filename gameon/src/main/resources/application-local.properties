# ============================================================
# GameOn - Local Profile (H2 In-Memory Database)
# Use: Run immediately in browser WITHOUT SQL Server installed
# Activate: --spring.profiles.active=local
# URL: http://localhost:8080
# ============================================================

# ===== H2 In-Memory Database (SQL Server compatibility mode) =====
spring.datasource.url=jdbc:h2:mem:GameOnDb;DB_CLOSE_DELAY=-1;MODE=MSSQLServer;DATABASE_TO_LOWER=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

# ===== H2 Console (browse DB at http://localhost:8080/h2-console) =====
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=false

# ===== JPA - Auto-create schema from entities =====
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

# ===== Flyway - Disabled (Hibernate handles schema) =====
spring.flyway.enabled=false

# ===== Thymeleaf =====
spring.thymeleaf.cache=false

# ===== Logging =====
logging.level.com.gameon=DEBUG
logging.level.org.springframework.security=DEBUG
logging.level.org.hibernate.SQL=DEBUG
