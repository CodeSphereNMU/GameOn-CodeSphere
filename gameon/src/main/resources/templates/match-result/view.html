<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/layout :: head('Match Result')}"></head>
<body class="bg-light">
    <nav th:replace="~{fragments/layout :: navbar('lobby')}"></nav>
    <div th:replace="~{fragments/layout :: tabs('lobby')}"></div>

    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
          integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">

    <div class="container mt-4">
        <div class="row justify-content-center">
            <div class="col-md-8">
                <div class="card shadow-sm">
                    <div class="card-header bg-white text-center">
                        <h5 class="mb-0" th:text="${listing.format.sport.sportName + ' - ' + listing.format.formatName}">Sport</h5>
                        <small class="text-muted">
                            <span th:text="${#temporals.format(listing.scheduledDate, 'dd MMM yyyy HH:mm')}">Date</span>
                            | <span th:text="${listing.venueName != null ? listing.venueName : listing.location}">Location</span>
                        </small>
                    </div>
                    <div class="card-body text-center">
                        <!-- Score Display -->
                        <div class="row align-items-center py-4">
                            <div class="col-4">
                                <h6 class="text-danger">Team A</h6>
                                <span class="display-4 fw-bold" th:text="${result.teamAScore}">0</span>
                            </div>
                            <div class="col-4">
                                <span class="fs-3 text-muted">vs</span>
                                <br>
                                <span class="badge mt-2"
                                      th:classappend="${result.winners == 'DRAW'} ? 'bg-secondary' : (${result.winners == 'TEAM_A'} ? 'bg-danger' : 'bg-primary')"
                                      th:text="${result.winners.replace('_', ' ')}">Winner</span>
                            </div>
                            <div class="col-4">
                                <h6 class="text-primary">Team B</h6>
                                <span class="display-4 fw-bold" th:text="${result.teamBScore}">0</span>
                            </div>
                        </div>

                        <!-- Teams Roster -->
                        <hr>
                        <div class="row mt-3">
                            <div class="col-6">
                                <h6 class="text-danger">Team A</h6>
                                <ul class="list-unstyled">
                                    <li class="mb-1">
                                        <i class="bi bi-person-fill me-1"></i>
                                        <span th:text="${listing.creator.username}">Creator</span>
                                        <small class="text-muted">(creator)</small>
                                    </li>
                                    <li th:each="joiner : ${listing.joiners}"
                                        th:if="${joiner.team.name() == 'A' && (joiner.status.name() == 'ACCEPTED' || joiner.status.name() == 'LOCKED')}"
                                        class="mb-1">
                                        <i class="bi bi-person me-1"></i>
                                        <span th:text="${joiner.user.username}">Player</span>
                                    </li>
                                </ul>
                            </div>
                            <div class="col-6">
                                <h6 class="text-primary">Team B</h6>
                                <ul class="list-unstyled">
                                    <li th:each="joiner : ${listing.joiners}"
                                        th:if="${joiner.team.name() == 'B' && (joiner.status.name() == 'ACCEPTED' || joiner.status.name() == 'LOCKED')}"
                                        class="mb-1">
                                        <i class="bi bi-person me-1"></i>
                                        <span th:text="${joiner.user.username}">Player</span>
                                    </li>
                                </ul>
                            </div>
                        </div>
                    </div>

                    <!-- Venue Map Preview -->
                    <div th:if="${listing.latitude != null && listing.longitude != null}" class="card-body border-top pt-3">
                        <h6 class="mb-2"><i class="bi bi-geo-alt me-1 text-danger"></i>Venue</h6>
                        <p class="mb-1 small fw-bold" th:text="${listing.venueName != null ? listing.venueName : listing.location}">Venue</p>
                        <p th:if="${listing.address != null}" class="mb-2 small text-muted" th:text="${listing.address}">Address</p>
                        <div id="matchResultMap" style="height: 180px; border-radius: 8px; border: 1px solid #dee2e6;"></div>
                        <div class="mt-2">
                            <a th:href="'https://www.google.com/maps/dir/?api=1&destination=' + ${listing.latitude} + ',' + ${listing.longitude}"
                               target="_blank" class="btn btn-outline-gameon btn-sm">
                                <i class="bi bi-signpost-2 me-1"></i>Get Directions
                            </a>
                        </div>
                    </div>

                    <div class="card-footer bg-white text-center">
                        <small class="text-muted">Result recorded
                            <span th:text="${#temporals.format(result.createdAt, 'dd MMM yyyy HH:mm')}">Date</span>
                        </small>
                    </div>
                </div>

                <div class="mt-3">
                    <a th:href="@{/lobby/history}" class="btn btn-outline-secondary btn-sm">
                        <i class="bi bi-arrow-left me-1"></i>Back to History
                    </a>
                </div>
            </div>
        </div>
    </div>

    <div th:replace="~{fragments/layout :: scripts}"></div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
            integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>

    <script th:if="${listing.latitude != null && listing.longitude != null}">
    (function() {
        var lat = [[${listing.latitude}]];
        var lng = [[${listing.longitude}]];
        var venueName = '[[${listing.venueName != null ? listing.venueName : listing.location}]]';

        var map = L.map('matchResultMap').setView([lat, lng], 15);

        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors',
            maxZoom: 19
        }).addTo(map);

        L.marker([lat, lng]).addTo(map)
            .bindPopup('<strong>' + venueName + '</strong>')
            .openPopup();
    })();
    </script>
</body>
</html>
