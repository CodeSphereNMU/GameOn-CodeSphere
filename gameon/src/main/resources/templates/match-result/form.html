<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/layout :: head('Submit Score')}"></head>
<body class="bg-light">
    <nav th:replace="~{fragments/layout :: navbar('lobby')}"></nav>
    <div th:replace="~{fragments/layout :: tabs('lobby')}"></div>

    <div class="container mt-4">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card shadow-sm">
                    <div class="card-header bg-white">
                        <h5 class="mb-0">
                            <i class="bi bi-clipboard-data me-2 text-danger"></i>
                            <span th:text="${isUpdate} ? 'Update Match Result' : 'Submit Match Result'">Submit Score</span>
                        </h5>
                    </div>
                    <div class="card-body">
                        <!-- Listing Info -->
                        <div class="card bg-light mb-4">
                            <div class="card-body py-2">
                                <h6 th:text="${listing.format.sport.sportName + ' - ' + listing.format.formatName}">Sport</h6>
                                <small class="text-muted">
                                    <i class="bi bi-calendar me-1"></i>
                                    <span th:text="${#temporals.format(listing.scheduledDate, 'dd MMM yyyy HH:mm')}">Date</span>
                                    <span class="ms-2"><i class="bi bi-geo-alt me-1"></i><span th:text="${listing.location}">Location</span></span>
                                </small>
                            </div>
                        </div>

                        <!-- Flash Messages -->
                        <div th:if="${error}" class="alert alert-danger" th:text="${error}">Error</div>

                        <!-- Score Form -->
                        <form th:action="${isUpdate} ? @{'/match-result/update/' + ${listing.gameListingId}} : @{'/match-result/submit/' + ${listing.gameListingId}}"
                              method="post">
                            <div class="row g-3 mb-4">
                                <div class="col-5">
                                    <label for="teamAScore" class="form-label text-center d-block fw-bold text-danger">Team A Score</label>
                                    <input type="number" class="form-control form-control-lg text-center" id="teamAScore"
                                           name="teamAScore" min="0" required
                                           th:value="${isUpdate && result != null} ? ${result.teamAScore} : '0'">
                                </div>
                                <div class="col-2 d-flex align-items-end justify-content-center pb-2">
                                    <span class="fs-4 fw-bold text-muted">-</span>
                                </div>
                                <div class="col-5">
                                    <label for="teamBScore" class="form-label text-center d-block fw-bold text-primary">Team B Score</label>
                                    <input type="number" class="form-control form-control-lg text-center" id="teamBScore"
                                           name="teamBScore" min="0" required
                                           th:value="${isUpdate && result != null} ? ${result.teamBScore} : '0'">
                                </div>
                            </div>

                            <div class="d-flex gap-2">
                                <button type="submit" class="btn btn-gameon">
                                    <i class="bi bi-check-lg me-1"></i>
                                    <span th:text="${isUpdate} ? 'Update Score' : 'Submit Score'">Submit</span>
                                </button>
                                <a th:href="@{/lobby/created}" class="btn btn-outline-secondary">Cancel</a>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
