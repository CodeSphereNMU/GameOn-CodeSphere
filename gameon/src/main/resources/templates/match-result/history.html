<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/layout :: head('Match History')}"></head>
<body class="bg-light">
    <nav th:replace="~{fragments/layout :: navbar('lobby')}"></nav>
    <div th:replace="~{fragments/layout :: tabs('lobby')}"></div>

    <div class="container mt-4">
        <h4 class="mb-3"><i class="bi bi-trophy me-2"></i>Match History</h4>

        <div th:if="${results.isEmpty()}" class="text-center text-muted py-5">
            <i class="bi bi-trophy" style="font-size: 3rem;"></i>
            <p class="mt-2">No match results yet. Play some games!</p>
        </div>

        <div th:unless="${results.isEmpty()}" class="list-group">
            <a th:each="result : ${results}"
               th:href="@{'/match-result/view/' + ${result.gameListing.gameListingId}}"
               class="list-group-item list-group-item-action">
                <div class="d-flex justify-content-between align-items-center">
                    <div>
                        <h6 class="mb-1" th:text="${result.gameListing.format.sport.sportName + ' - ' + result.gameListing.format.formatName}">Sport</h6>
                        <small class="text-muted"
                               th:text="${#temporals.format(result.gameListing.scheduledDate, 'dd MMM yyyy')}">Date</small>
                        <br>
                        <small class="text-muted">
                            <i class="bi bi-geo-alt me-1"></i>
                            <span th:text="${result.gameListing.venueName != null ? result.gameListing.venueName : result.gameListing.location}">Location</span>
                        </small>
                    </div>
                    <div class="text-end">
                        <span class="fs-5 fw-bold" th:text="${result.teamAScore + ' - ' + result.teamBScore}">0 - 0</span>
                        <br>
                        <span class="badge"
                              th:classappend="${result.winners == 'DRAW'} ? 'bg-secondary' : (${result.winners == 'TEAM_A'} ? 'bg-danger' : 'bg-primary')"
                              th:text="${result.winners.replace('_', ' ')}">Winner</span>
                    </div>
                </div>
            </a>
        </div>
    </div>

    <div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
