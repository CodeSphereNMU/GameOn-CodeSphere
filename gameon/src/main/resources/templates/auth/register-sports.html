<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Select Sports - GameOn</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
<link th:href="@{/css/auth.css}" href="/css/auth.css" rel="stylesheet">
</head><body class="auth-page"><main class="auth-shell sports"><section class="auth-visual"><div class="auth-visual-copy"><h1 class="brand-title">GAME ON</h1><p class="visual-tagline">Find local games.<br>Join a team.<br>Get playing.</p><div class="auth-benefits"><div><i class="bi bi-people"></i>Find local games</div><div><i class="bi bi-bar-chart"></i>Play at any level</div><div><i class="bi bi-trophy"></i>Track your stats</div></div></div><img th:src="@{/images/gameon-auth-sports.png}" src="/images/gameon-auth-sports.png" class="auth-artwork" alt="Game On sports illustration"></section><section class="auth-form-panel sports-panel"><div class="register-progress"><div class="progress-step active"><span><i class="bi bi-check-lg"></i></span><small>Account Details</small></div><div class="progress-line active"></div><div class="progress-step active"><span>2</span><small>Sports &amp; Preferences</small></div></div><h2 class="form-heading">Tell us what you play</h2><p class="auth-subtitle">Step 2 of 2 · Choose your sports and skill level</p><div th:if="${error}" class="alert alert-danger" role="alert" th:text="${error}">Error</div><form th:action="@{/register-sports}" th:object="${registerStep2Dto}" method="post"><p class="sport-intro">Select at least one sport and your skill level:</p><div th:each="sport, iter : ${sports}" class="card sport-card mb-3 p-3"><div class="d-flex align-items-center justify-content-between"><div class="form-check"><input class="form-check-input sport-checkbox" type="checkbox" th:id="'sport-' + ${sport.sportId}" th:name="'sportSelections[' + ${iter.index} + '].sportId'" th:value="${sport.sportId}"><label class="form-check-label fw-bold ms-1" th:for="'sport-' + ${sport.sportId}" th:text="${sport.sportName}">Sport</label></div><select class="form-select form-select-sm" style="width:auto;" th:name="'sportSelections[' + ${iter.index} + '].skillLevel'"><option th:each="level : ${skillLevels}" th:value="${level}" th:text="${level}">Level</option></select></div></div><div class="d-grid mt-4"><button type="submit" class="btn btn-gameon btn-lg text-white">Complete Registration</button></div></form></section></main><script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script><script>document.querySelectorAll('.sport-card').forEach(card=>{const checkbox=card.querySelector('.sport-checkbox');card.addEventListener('click',function(e){if(e.target.tagName==='SELECT'||e.target.tagName==='OPTION')return;if(e.target===checkbox||e.target.tagName==='LABEL')return;checkbox.checked=!checkbox.checked;card.classList.toggle('selected',checkbox.checked);});checkbox.addEventListener('change',function(){card.classList.toggle('selected',checkbox.checked);});});</script></body></html>
