<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - GameOn</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        body { background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%); min-height: 100vh; }
        .register-card { background: #fff; border-radius: 16px; box-shadow: 0 20px 60px rgba(0,0,0,0.3); }
        .brand-title { font-style: italic; font-weight: 800; color: #DC3545; font-size: 2.5rem; }
        .btn-gameon { background-color: #DC3545; border-color: #DC3545; border-radius: 25px; }
        .btn-gameon:hover { background-color: #bb2d3b; border-color: #bb2d3b; }
        .step-indicator { font-size: 0.85rem; color: #6c757d; }
        .password-toggle { cursor: pointer; border-color: #ced4da; }
        .password-toggle:hover { background-color: #e9ecef; }
    </style>
</head>
<body>
    <div class="container d-flex align-items-center justify-content-center" style="min-height: 100vh;">
        <div class="col-md-5 col-lg-4">
            <div class="register-card p-5">
                <div class="text-center mb-4">
                    <h1 class="brand-title">GAME ON</h1>
                    <p class="step-indicator">Step 1 of 2 - Create Account</p>
                </div>

                <!-- Error Messages -->
                <div th:if="${error}" class="alert alert-danger alert-dismissible fade show" role="alert">
                    <span th:text="${error}">Error</span>
                    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                </div>

                <!-- Registration Form -->
                <form th:action="@{/register}" th:object="${registerDto}" method="post" novalidate>
                    <div class="mb-3">
                        <label for="username" class="form-label">Username</label>
                        <input type="text" class="form-control" th:classappend="${#fields.hasErrors('username')} ? 'is-invalid'"
                               id="username" th:field="*{username}" placeholder="Choose a username" required>
                        <div class="invalid-feedback" th:if="${#fields.hasErrors('username')}" th:errors="*{username}">
                            Username error
                        </div>
                    </div>

                    <div class="mb-3">
                        <label for="password" class="form-label">Password</label>
                        <div class="input-group">
                            <input type="password" class="form-control"
                                   th:classappend="${#fields.hasErrors('password')} ? 'is-invalid'"
                                   id="password" th:field="*{password}"
                                   placeholder="Min 6 characters" required>
                            <button type="button" class="btn btn-outline-secondary password-toggle"
                                    data-target="password" aria-label="Show password">
                                <i class="bi bi-eye"></i>
                            </button>
                            <div class="invalid-feedback" th:if="${#fields.hasErrors('password')}" th:errors="*{password}">
                                Password error
                            </div>
                        </div>
                    </div>

                    <div class="mb-3">
                        <label for="confirmPassword" class="form-label">Confirm Password</label>
                        <div class="input-group">
                            <input type="password" class="form-control"
                                   th:classappend="${#fields.hasErrors('confirmPassword')} ? 'is-invalid'"
                                   id="confirmPassword" th:field="*{confirmPassword}"
                                   placeholder="Re-enter password" required>
                            <button type="button" class="btn btn-outline-secondary password-toggle"
                                    data-target="confirmPassword" aria-label="Show password">
                                <i class="bi bi-eye"></i>
                            </button>
                            <div class="invalid-feedback" th:if="${#fields.hasErrors('confirmPassword')}" th:errors="*{confirmPassword}">
                                Confirm password error
                            </div>
                        </div>
                    </div>

                    <div class="d-grid mb-3">
                        <button type="submit" class="btn btn-gameon btn-lg text-white">Next</button>
                    </div>
                </form>

                <div class="text-center">
                    <p class="text-muted mb-0">Already have an account?
                        <a th:href="@{/login}" class="text-danger fw-bold text-decoration-none">Login</a>
                    </p>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script>
    (function () {
        document.querySelectorAll('.password-toggle').forEach(function (button) {
            button.addEventListener('click', function () {
                var input = document.getElementById(button.getAttribute('data-target'));
                var icon = button.querySelector('i');

                if (input.type === 'password') {
                    input.type = 'text';
                    icon.classList.remove('bi-eye');
                    icon.classList.add('bi-eye-slash');
                    button.setAttribute('aria-label', 'Hide password');
                } else {
                    input.type = 'password';
                    icon.classList.remove('bi-eye-slash');
                    icon.classList.add('bi-eye');
                    button.setAttribute('aria-label', 'Show password');
                }
            });
        });
    })();
    </script>
</body>
</html>
