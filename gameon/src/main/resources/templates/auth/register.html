<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Register - GameOn</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
<link th:href="@{/css/auth.css}" href="/css/auth.css" rel="stylesheet">
</head><body class="auth-page"><main class="auth-shell"><section class="auth-visual"><div class="auth-visual-copy"><h1 class="brand-title">GAME ON</h1><p class="visual-tagline">Find local games.<br>Join a team.<br>Get playing.</p><div class="auth-benefits"><div><i class="bi bi-people"></i>Find local games</div><div><i class="bi bi-bar-chart"></i>Play at any level</div><div><i class="bi bi-trophy"></i>Track your stats</div></div></div><img th:src="@{/images/gameon-auth-sports.png}" src="/images/gameon-auth-sports.png" class="auth-artwork" alt="Game On sports illustration"></section><section class="auth-form-panel"><div class="register-progress"><div class="progress-step active"><span>1</span><small>Account Details</small></div><div class="progress-line"></div><div class="progress-step"><span>2</span><small>Sports &amp; Preferences</small></div></div><h2 class="form-heading">Create your account</h2><p class="auth-subtitle">Step 1 of 2 · Your login details</p><div th:if="${error}" class="alert alert-danger alert-dismissible fade show"><span th:text="${error}">Error</span><button type="button" class="btn-close" data-bs-dismiss="alert"></button></div><form th:action="@{/register}" th:object="${registerDto}" method="post" novalidate><div class="mb-3"><label for="username" class="form-label">Username</label><input type="text" class="form-control" th:classappend="${#fields.hasErrors('username')} ? 'is-invalid'" id="username" th:field="*{username}" placeholder="Choose a username" required><div class="invalid-feedback" th:if="${#fields.hasErrors('username')}" th:errors="*{username}">Username error</div></div><div class="mb-3"><label for="password" class="form-label">Password</label><div class="input-group"><input type="password" class="form-control" th:classappend="${#fields.hasErrors('password')} ? 'is-invalid'" id="password" th:field="*{password}" placeholder="Min 6 characters" required><button type="button" class="btn password-toggle" data-target="password" aria-label="Show password"><i class="bi bi-eye"></i></button><div class="invalid-feedback" th:if="${#fields.hasErrors('password')}" th:errors="*{password}">Password error</div></div></div><div class="mb-3"><label for="confirmPassword" class="form-label">Confirm Password</label><div class="input-group"><input type="password" class="form-control" th:classappend="${#fields.hasErrors('confirmPassword')} ? 'is-invalid'" id="confirmPassword" th:field="*{confirmPassword}" placeholder="Re-enter password" required><button type="button" class="btn password-toggle" data-target="confirmPassword" aria-label="Show password"><i class="bi bi-eye"></i></button><div class="invalid-feedback" th:if="${#fields.hasErrors('confirmPassword')}" th:errors="*{confirmPassword}">Confirm password error</div></div></div><div class="d-grid mt-4 mb-3"><button type="submit" class="btn btn-gameon btn-lg text-white">Next</button></div></form><div class="text-center"><p class="text-muted mb-0">Already have an account? <a th:href="@{/login}" class="auth-link">Login</a></p></div></section></main><script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script><script>(function(){document.querySelectorAll('.password-toggle').forEach(function(button){button.addEventListener('click',function(){var input=document.getElementById(button.getAttribute('data-target'));var icon=button.querySelector('i');if(input.type==='password'){input.type='text';icon.classList.replace('bi-eye','bi-eye-slash');button.setAttribute('aria-label','Hide password');}else{input.type='password';icon.classList.replace('bi-eye-slash','bi-eye');button.setAttribute('aria-label','Show password');}});});})();</script></body></html>
