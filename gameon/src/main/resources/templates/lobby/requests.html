<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/layout :: head('Join Requests')}"></head>
<body class="bg-light">
    <nav th:replace="~{fragments/layout :: navbar('lobby')}"></nav>
    <div th:replace="~{fragments/layout :: tabs('lobby')}"></div>

    <div class="container mt-4">
        <!-- Flash Messages -->
        <div th:if="${success}" class="alert alert-success alert-dismissible fade show" role="alert">
            <span th:text="${success}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>
        <div th:if="${error}" class="alert alert-danger alert-dismissible fade show" role="alert">
            <span th:text="${error}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>

        <div class="d-flex justify-content-between align-items-center mb-3">
            <h4>
                Join Requests -
                <span th:text="${listing.format.sport.sportName + ' ' + listing.format.formatName}">Sport</span>
            </h4>
            <a th:href="@{/lobby/created}" class="btn btn-outline-secondary btn-sm">
                <i class="bi bi-arrow-left me-1"></i>Back
            </a>
        </div>

        <!-- Capacity Status -->
        <div class="alert mb-4" th:classappend="${listingFull} ? 'alert-danger' : 'alert-info'">
            <i class="bi me-1" th:classappend="${listingFull} ? 'bi-x-circle' : 'bi-people'"></i>
            <strong>Players:</strong>
            <span th:text="${currentParticipants}">2</span>/<span th:text="${maxPlayers}">4</span>
            <span th:if="${listingFull}" class="fw-bold ms-2">— Listing Full</span>
            <span th:unless="${listingFull}" class="ms-2">
                | Team A: <span th:text="${teamAFull} ? 'Full' : 'Open'">Open</span>
                | Team B: <span th:text="${teamBFull} ? 'Full' : 'Open'">Open</span>
            </span>
        </div>

        <!-- Accepted Players -->
        <div th:if="${!acceptedJoiners.isEmpty()}" class="card shadow-sm mb-4">
            <div class="card-header bg-white">
                <h6 class="mb-0 text-success"><i class="bi bi-check-circle me-1"></i>Accepted Players</h6>
            </div>
            <div class="list-group list-group-flush">
                <div th:each="joiner : ${acceptedJoiners}" class="list-group-item d-flex justify-content-between align-items-center">
                    <div>
                        <i class="bi bi-person-circle me-2"></i>
                        <strong th:text="${joiner.user.username}">User</strong>
                        <span class="badge ms-2" th:classappend="${joiner.team.name() == 'A'} ? 'bg-danger' : 'bg-primary'"
                              th:text="'Team ' + ${joiner.team}">Team</span>
                    </div>
                    <span class="badge bg-success">Accepted</span>
                </div>
            </div>
        </div>

        <!-- Pending Requests -->
        <div class="card shadow-sm">
            <div class="card-header bg-white">
                <h6 class="mb-0 text-warning"><i class="bi bi-hourglass-split me-1"></i>Pending Requests
                    <span class="badge bg-warning text-dark ms-1" th:text="${pendingRequests.size()}">0</span>
                </h6>
            </div>
            <div th:if="${pendingRequests.isEmpty()}" class="card-body text-center text-muted py-4">
                <p>No pending requests</p>
            </div>
            <div th:unless="${pendingRequests.isEmpty()}" class="list-group list-group-flush">
                <div th:each="req : ${pendingRequests}" class="list-group-item">
                    <div class="d-flex justify-content-between align-items-center">
                        <div>
                            <i class="bi bi-person-circle me-2"></i>
                            <a th:href="@{'/profile/' + ${req.user.userId}}" th:text="${req.user.username}" class="fw-bold text-decoration-none">User</a>
                            <span class="badge ms-2" th:classappend="${req.team.name() == 'A'} ? 'bg-danger' : 'bg-primary'"
                                  th:text="'Team ' + ${req.team}">Team</span>
                        </div>
                        <div class="d-flex gap-2"
                             th:with="teamFull=${(req.team.name() == 'A' and teamAFull) or (req.team.name() == 'B' and teamBFull)},
                                      btnDisabled=${listingFull or ((req.team.name() == 'A' and teamAFull) or (req.team.name() == 'B' and teamBFull))},
                                      btnTitle=${listingFull ? 'Listing is full' : (teamFull ? 'Team is full' : 'Accept request')}">
                            <form th:action="@{'/lobby/requests/' + ${listing.gameListingId} + '/accept/' + ${req.user.userId}}" method="post">
                                <button type="submit" class="btn btn-success btn-sm"
                                        th:disabled="${btnDisabled}"
                                        th:title="${btnTitle}">
                                    <i class="bi bi-check-lg"></i> Accept
                                </button>
                            </form>
                            <form th:action="@{'/lobby/requests/' + ${listing.gameListingId} + '/reject/' + ${req.user.userId}}" method="post">
                                <button type="submit" class="btn btn-outline-danger btn-sm">
                                    <i class="bi bi-x-lg"></i> Reject
                                </button>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
