<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/layout :: head('Profile')}"></head>
<body class="bg-light">
    <nav th:replace="~{fragments/layout :: navbar('none')}"></nav>
    <div th:replace="~{fragments/layout :: tabs('none')}"></div>

    <div class="container mt-4">
        <!-- Flash Messages -->
        <div th:if="${success}" class="alert alert-success alert-dismissible fade show" role="alert">
            <span th:text="${success}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>
        <div th:if="${error}" class="alert alert-danger alert-dismissible fade show" role="alert">
            <span th:text="${error}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>

        <div class="row">
            <!-- Profile Card -->
            <div class="col-md-4">
                <div class="card shadow-sm">
                    <div class="card-body text-center">
                        <i class="bi bi-person-circle text-muted" style="font-size: 5rem;"></i>
                        <h4 class="mt-2" th:text="${user.username}">Username</h4>
                        <span class="badge bg-secondary" th:text="${user.userRole}">ROLE</span>

                        <div class="d-flex justify-content-center gap-4 mt-3">
                            <div class="text-center">
                                <strong th:text="${followerCount}">0</strong>
                                <br><small class="text-muted">Followers</small>
                            </div>
                            <div class="text-center">
                                <strong th:text="${followingCount}">0</strong>
                                <br><small class="text-muted">Following</small>
                            </div>
                        </div>

                        <!-- Action Buttons -->
                        <div class="mt-3" th:if="${isOwnProfile}">
                            <a th:href="@{/profile/edit}" class="btn btn-outline-gameon btn-sm w-100 mb-2">
                                <i class="bi bi-pencil me-1"></i>Edit Profile
                            </a>
                            <a th:href="@{/profile/add-sport}" class="btn btn-gameon btn-sm w-100">
                                <i class="bi bi-plus-lg me-1"></i>Add Sport
                            </a>
                        </div>
                        <div class="mt-3" th:unless="${isOwnProfile}">
                            <form th:action="@{'/profile/' + ${user.userId} + '/follow'}" method="post">
                                <button type="submit" class="btn btn-sm w-100"
                                        th:classappend="${isFollowing} ? 'btn-outline-secondary' : 'btn-gameon'"
                                        th:text="${isFollowing} ? 'Unfollow' : 'Follow'">Follow</button>
                            </form>
                            <a th:href="@{'/report/user/' + ${user.userId}}" class="btn btn-outline-secondary btn-sm w-100 mt-2">
                                <i class="bi bi-flag me-1"></i>Report User
                            </a>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Sports Section -->
            <div class="col-md-8">
                <div class="card shadow-sm">
                    <div class="card-header bg-white d-flex justify-content-between align-items-center">
                        <h5 class="mb-0">Sports</h5>
                    </div>
                    <div class="card-body">
                        <div th:if="${sports.isEmpty()}" class="text-center text-muted py-3">
                            <p>No sports on profile yet.</p>
                        </div>
                        <div class="row g-3">
                            <div th:each="sp : ${sports}" class="col-md-6">
                                <div class="card h-100">
                                    <div class="card-body">
                                        <div class="d-flex justify-content-between align-items-start">
                                            <div>
                                                <h6 class="card-title mb-1" th:text="${sp.sport.sportName}">Sport</h6>
                                                <span class="badge badge-skill"
                                                      th:classappend="${sp.skillLevel.name() == 'BEGINNER'} ? 'bg-success' : (${sp.skillLevel.name() == 'INTERMEDIATE'} ? 'bg-warning text-dark' : 'bg-danger')"
                                                      th:text="${sp.skillLevel}">Level</span>
                                            </div>
                                            <div th:if="${isOwnProfile}">
                                                <form th:action="@{/profile/remove-sport}" method="post"
                                                      onsubmit="return confirm('Remove this sport?')">
                                                    <input type="hidden" name="sportId" th:value="${sp.sport.sportId}">
                                                    <button type="submit" class="btn btn-sm btn-outline-danger">
                                                        <i class="bi bi-x-lg"></i>
                                                    </button>
                                                </form>
                                            </div>
                                        </div>
                                        <div class="mt-2 small text-muted">
                                            <span th:text="${sp.wins}">0</span>W -
                                            <span th:text="${sp.losses}">0</span>L
                                            <span class="ms-2 fw-bold"
                                                  th:text="${#numbers.formatDecimal(sp.winPercentage, 1, 1)} + '%'">0%</span>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
