<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/layout :: head('Posts')}"></head>
<body class="gameon-page">
    <nav th:replace="~{fragments/layout :: navbar('none')}"></nav>
    <div class="gameon-container">
    <div th:replace="~{fragments/layout :: tabs('none')}"></div>

    <div class="container mt-4">
        <div class="d-flex justify-content-between align-items-center mb-3">
            <h4 th:text="|${user.username}'s Posts|">User's Posts</h4>
            <a th:href="@{'/profile/' + ${user.userId}}" class="btn btn-outline-gameon btn-sm">
                <i class="bi bi-arrow-left me-1"></i>Back to Profile
            </a>
        </div>

        <div th:if="${posts.isEmpty()}" class="card shadow-sm">
            <div class="card-body text-center text-muted py-4">
                <i class="bi bi-journal-text" style="font-size: 3rem;"></i>
                <p class="mt-2">No posts yet.</p>
            </div>
        </div>

        <div th:unless="${posts.isEmpty()}">
            <div th:each="post : ${posts}" class="card shadow-sm mb-3">
                <div class="card-body">
                    <div class="d-flex justify-content-between align-items-start">
                        <div>
                            <h6 class="mb-1" th:text="${user.username}">Username</h6>
                            <small class="text-muted" th:text="${#temporals.format(post.createdAt, 'dd MMM yyyy, HH:mm')}">Date</small>
                        </div>
                        <span class="badge bg-secondary" th:text="${post.privacySetting}">PUBLIC</span>
                    </div>
                    <p class="mt-2 mb-0" th:text="${post.content}">Post content</p>
                </div>
            </div>

            <!-- Pagination -->
            <nav th:if="${posts.totalPages > 1}" class="mt-4">
                <ul class="pagination justify-content-center">
                    <li class="page-item" th:classappend="${posts.first} ? 'disabled'">
                        <a class="page-link" th:href="@{'/profile/' + ${user.userId} + '/posts'(page=${posts.number - 1})}">Previous</a>
                    </li>
                    <li th:each="i : ${#numbers.sequence(0, posts.totalPages - 1)}"
                        class="page-item" th:classappend="${i == posts.number} ? 'active'">
                        <a class="page-link" th:href="@{'/profile/' + ${user.userId} + '/posts'(page=${i})}" th:text="${i + 1}">1</a>
                    </li>
                    <li class="page-item" th:classappend="${posts.last} ? 'disabled'">
                        <a class="page-link" th:href="@{'/profile/' + ${user.userId} + '/posts'(page=${posts.number + 1})}">Next</a>
                    </li>
                </ul>
            </nav>
        </div>
    </div>

    </div><!-- /.gameon-container -->

    <div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
