<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/layout :: head('Posts')}"></head>
<body class="bg-light">
    <th:block th:replace="~{social/carousel-css :: style}"></th:block>
    <nav th:replace="~{fragments/layout :: navbar('none')}"></nav>
    <div th:replace="~{fragments/layout :: tabs('none')}"></div>

    <div class="container mt-4">
        <div class="d-flex justify-content-between align-items-center mb-3">
            <h4 th:text="|${user.username}'s Posts|">User's Posts</h4>
            <a th:href="@{'/profile/' + ${user.userId}}" class="btn btn-outline-gameon btn-sm">
                <i class="bi bi-arrow-left me-1"></i>Back to Profile
            </a>
        </div>

        <div th:if="${posts.isEmpty()}" class="card shadow-sm">
            <div class="card-body text-center text-muted py-4">
                <i class="bi bi-journal-text" style="font-size: 3rem;"></i>
                <p class="mt-2">No posts yet.</p>
            </div>
        </div>

        <div th:unless="${posts.isEmpty()}">
            <div th:each="post : ${posts}" class="card shadow-sm mb-3">
                <div class="card-body">
                    <div class="d-flex justify-content-between align-items-start">
                        <div>
                            <h6 class="mb-1" th:text="${user.username}">Username</h6>
                            <small class="text-muted" th:text="${#temporals.format(post.createdAt, 'dd MMM yyyy, HH:mm')}">Date</small>
                        </div>
                        <span class="badge bg-secondary" th:text="${post.privacySetting}">PUBLIC</span>
                    </div>
                    <p class="mt-2 mb-0" th:if="${post.content != null and !post.content.isEmpty()}"
                       th:text="${post.content}">Post content</p>

                    <!-- Post Images (carousel) - reuses the Social Feed carousel -->
                    <th:block th:with="images=${postImages != null ? postImages.get(post.postId) : null}">
    <div th:if="${images != null and !images.isEmpty()}"
         class="post-carousel mt-2"
         th:attr="data-count=${images.size()}">

        <div class="post-carousel-viewport">
            <img th:each="path,iter : ${images}"
                 th:src="@{${path}}"
                 class="post-carousel-img"
                 th:classappend="${iter.index == 0} ? 'active'"
                 th:attr="data-index=${iter.index}"
                 alt="Post image"
                 loading="lazy">
        </div>

        <button type="button"
                class="post-carousel-btn prev"
                th:if="${images.size() > 1}"
                aria-label="Previous">
            <i class="bi bi-chevron-left"></i>
        </button>

        <button type="button"
                class="post-carousel-btn next"
                th:if="${images.size() > 1}"
                aria-label="Next">
            <i class="bi bi-chevron-right"></i>
        </button>

        <div class="post-carousel-indicator"
             th:if="${images.size() > 1}">
            <span class="pos">1</span>/<span class="total"
                                             th:text="${images.size()}">1</span>
        </div>

        <div class="post-carousel-dots"
             th:if="${images.size() > 1}">
            <span th:each="path,iter : ${images}"
                  class="dot"
                  th:classappend="${iter.index == 0} ? 'active'"
                  th:attr="data-index=${iter.index}"></span>
        </div>
    </div>
</th:block>
                </div>
            </div>

            <!-- Pagination -->
            <nav th:if="${posts.totalPages > 1}" class="mt-4">
                <ul class="pagination justify-content-center">
                    <li class="page-item" th:classappend="${posts.first} ? 'disabled'">
                        <a class="page-link" th:href="@{'/profile/' + ${user.userId} + '/posts'(page=${posts.number - 1})}">Previous</a>
                    </li>
                    <li th:each="i : ${#numbers.sequence(0, posts.totalPages - 1)}"
                        class="page-item" th:classappend="${i == posts.number} ? 'active'">
                        <a class="page-link" th:href="@{'/profile/' + ${user.userId} + '/posts'(page=${i})}" th:text="${i + 1}">1</a>
                    </li>
                    <li class="page-item" th:classappend="${posts.last} ? 'disabled'">
                        <a class="page-link" th:href="@{'/profile/' + ${user.userId} + '/posts'(page=${posts.number + 1})}">Next</a>
                    </li>
                </ul>
            </nav>
        </div>
    </div>

    <!-- Lightbox (shared) -->
    <div id="imgLightbox" class="img-lightbox">
        <button type="button" class="close-btn" aria-label="Close">&times;</button>
        <img src="" alt="Enlarged post image">
    </div>

    <div th:replace="~{fragments/layout :: scripts}"></div>
    <script th:replace="~{social/carousel-js :: script}"></script>
</body>
</html>
