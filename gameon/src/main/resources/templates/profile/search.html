<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/layout :: head('Search Users')}"></head>
<body class="bg-light">
    <nav th:replace="~{fragments/layout :: navbar('none')}"></nav>
    <div th:replace="~{fragments/layout :: tabs('none')}"></div>

    <div class="container mt-4">
        <h4>Search Users</h4>
        <form th:action="@{/profile/search}" method="get" class="mb-4">
            <div class="input-group">
                <input type="text" class="form-control" name="q" placeholder="Search by username..."
                       th:value="${query}" autofocus>
                <button type="submit" class="btn btn-gameon">
                    <i class="bi bi-search"></i> Search
                </button>
            </div>
        </form>

        <div th:if="${users != null && !users.isEmpty()}">
            <div class="list-group">
                <a th:each="user : ${users}" th:href="@{'/profile/' + ${user.userId}}"
                   class="list-group-item list-group-item-action d-flex align-items-center">
                    <i class="bi bi-person-circle fs-3 me-3 text-muted"></i>
                    <div>
                        <strong th:text="${user.username}">Username</strong>
                        <br><small class="text-muted" th:text="${user.userRole}">Role</small>
                    </div>
                </a>
            </div>
        </div>
        <div th:if="${users != null && users.isEmpty()}" class="text-center text-muted py-4">
            <p>No users found matching "<span th:text="${query}"></span>"</p>
        </div>
    </div>

    <div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
