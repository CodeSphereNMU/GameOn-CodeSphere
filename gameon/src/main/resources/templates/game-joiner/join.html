<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/layout :: head('Join Game')}"></head>
<body class="gameon-page">
    <nav th:replace="~{fragments/layout :: navbar('listings')}"></nav>
    <div class="gameon-container">
    <div th:replace="~{fragments/layout :: tabs('listings')}"></div>

    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
          integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">

    <div class="container mt-4">
        <div class="row justify-content-center">
            <div class="col-md-7">
                <div class="card shadow-sm">
                    <div class="card-header bg-white">
                        <h5 class="mb-0">
                            <i class="bi bi-person-plus me-2 text-danger"></i>Join Game
                        </h5>
                        <small class="text-muted"
                               th:text="${listing.format.sport.sportName + ' - ' + listing.format.formatName}">Sport Format</small>
                    </div>
                    <div class="card-body">
                        <!-- Listing Summary -->
                        <div class="card bg-light mb-3">
                            <div class="card-body py-2">
                                <p class="mb-1 small"><i class="bi bi-calendar me-1"></i><span th:text="${#temporals.format(listing.scheduledDate, 'dd MMM yyyy HH:mm')}">Date</span></p>
                                <p class="mb-1 small"><i class="bi bi-geo-alt me-1"></i><span th:text="${listing.venueName != null ? listing.venueName : listing.location}">Location</span></p>
                                <p th:if="${listing.address != null}" class="mb-1 small text-muted ms-3"><i class="bi bi-signpost me-1"></i><span th:text="${listing.address}">Address</span></p>
                                <p class="mb-0 small"><i class="bi bi-person me-1"></i>By <span th:text="${listing.creator.username}">Creator</span></p>
                            </div>
                        </div>

                        <!-- Map Display -->
                        <div th:if="${listing.latitude != null && listing.longitude != null}" class="card mb-3">
                            <div class="card-body p-0">
                                <div id="joinMap" style="height: 200px; border-radius: 12px;"></div>
                            </div>
                            <div class="card-footer bg-white d-flex gap-2">
                                <a th:href="'https://www.google.com/maps/dir/?api=1&destination=' + ${listing.latitude} + ',' + ${listing.longitude}"
                                   target="_blank" class="btn btn-outline-gameon btn-sm">
                                    <i class="bi bi-signpost-2 me-1"></i>Get Directions
                                </a>
                                <a th:href="'https://www.google.com/maps?q=' + ${listing.latitude} + ',' + ${listing.longitude}"
                                   target="_blank" class="btn btn-outline-secondary btn-sm">
                                    <i class="bi bi-box-arrow-up-right me-1"></i>View on Map
                                </a>
                            </div>
                        </div>

                        <form th:action="@{'/game-joiner/join/' + ${listing.gameListingId}}" method="post">
                            <!-- Team Selection -->
                            <div class="mb-3">
                                <label class="form-label">Select Team:</label>
                                <div class="d-flex gap-3">
                                    <div class="form-check">
                                        <input class="form-check-input" type="radio" name="team" value="A" id="teamA"
                                               th:checked="${!teamAFull}"
                                               th:disabled="${teamAFull}">
                                        <label class="form-check-label" for="teamA">
                                            <span class="badge bg-danger" th:classappend="${teamAFull} ? ' opacity-50' : ''">Team A</span>
                                            <span th:if="${teamAFull}" class="text-muted small ms-1">(Full)</span>
                                        </label>
                                    </div>
                                    <div class="form-check">
                                        <input class="form-check-input" type="radio" name="team" value="B" id="teamB"
                                               th:checked="${teamAFull && !teamBFull}"
                                               th:disabled="${teamBFull}">
                                        <label class="form-check-label" for="teamB">
                                            <span class="badge bg-primary" th:classappend="${teamBFull} ? ' opacity-50' : ''">Team B</span>
                                            <span th:if="${teamBFull}" class="text-muted small ms-1">(Full)</span>
                                        </label>
                                    </div>
                                </div>
                            </div>

                            <!-- Position Selection (if applicable) -->
                            <div th:if="${positions != null && !positions.isEmpty()}" class="mb-3">
                                <label class="form-label">Preferred Position:</label>
                                <select class="form-select" name="formatPositionId">
                                    <option value="">-- No preference --</option>
                                    <option th:each="fp : ${positions}"
                                            th:value="${fp.position.positionId}"
                                            th:text="${fp.position.positionName}">Position</option>
                                </select>
                            </div>

                            <div th:if="${positions != null && !positions.isEmpty()}" class="mb-3">
                                <label class="form-label">Alternative Position (optional):</label>
                                <select class="form-select" name="altFormatPositionId">
                                    <option value="">-- No alternative --</option>
                                    <option th:each="fp : ${positions}"
                                            th:value="${fp.position.positionId}"
                                            th:text="${fp.position.positionName}">Position</option>
                                </select>
                            </div>

                            <div class="d-flex gap-2">
                                <button type="submit" class="btn btn-gameon">
                                    <i class="bi bi-send me-1"></i>Send Join Request
                                </button>
                                <a th:href="@{'/listings/' + ${listing.gameListingId}}" class="btn btn-outline-secondary">Cancel</a>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    </div><!-- /.gameon-container -->

    <div th:replace="~{fragments/layout :: scripts}"></div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
            integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>

    <script th:if="${listing.latitude != null && listing.longitude != null}">
    (function() {
        var lat = [[${listing.latitude}]];
        var lng = [[${listing.longitude}]];
        var venueName = '[[${listing.venueName != null ? listing.venueName : listing.location}]]';

        var map = L.map('joinMap').setView([lat, lng], 15);

        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors',
            maxZoom: 19
        }).addTo(map);

        L.marker([lat, lng]).addTo(map)
            .bindPopup('<strong>' + venueName + '</strong>')
            .openPopup();
    })();
    </script>
</body>
</html>
