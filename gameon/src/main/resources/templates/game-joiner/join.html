<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/layout :: head('Join Game')}"></head>
<body class="bg-light">
    <nav th:replace="~{fragments/layout :: navbar('listings')}"></nav>
    <div th:replace="~{fragments/layout :: tabs('listings')}"></div>

    <div class="container mt-4">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card shadow-sm">
                    <div class="card-header bg-white">
                        <h5 class="mb-0">
                            <i class="bi bi-person-plus me-2 text-danger"></i>Join Game
                        </h5>
                        <small class="text-muted"
                               th:text="${listing.format.sport.sportName + ' - ' + listing.format.formatName}">Sport Format</small>
                    </div>
                    <div class="card-body">
                        <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>
                        <!-- Listing Summary -->
                        <div class="card bg-light mb-3">
                            <div class="card-body py-2">
                                <p class="mb-1 small"><i class="bi bi-calendar me-1"></i><span th:text="${#temporals.format(listing.scheduledDate, 'dd MMM yyyy HH:mm')}">Date</span></p>
                                <p class="mb-1 small"><i class="bi bi-geo-alt me-1"></i><span th:text="${listing.location}">Location</span></p>
                                <p class="mb-0 small"><i class="bi bi-person me-1"></i>By <span th:text="${listing.creator.username}">Creator</span></p>
                            </div>
                        </div>

                        <form th:action="@{'/game-joiner/join/' + ${listing.gameListingId}}" method="post" id="joinRequestForm">
                            <input type="hidden" name="team" th:value="${selectedTeam}">
                            <div class="alert alert-light border py-2">
                                Requesting to join <strong th:text="${'Team ' + selectedTeam}">Team A</strong>
                            </div>

                            <!-- Position Selection (if applicable) -->
                            <div th:if="${positions != null && !positions.isEmpty()}" class="mb-3">
                                <label class="form-label">Preferred Position:</label>
                                <select class="form-select" name="formatPositionId" id="primaryPosition">
                                    <option value="">Any Position</option>
                                    <option th:each="fp : ${positions}"
                                            th:value="${fp.position.positionId}"
                                            th:text="${fp.position.positionName}">Position</option>
                                </select>
                            </div>

                            <div th:if="${positions != null && !positions.isEmpty()}" class="mb-3">
                                <label class="form-label">Alternative Position (optional):</label>
                                <select class="form-select" name="altFormatPositionId" id="alternatePosition">
                                    <option value="">-- No alternative --</option>
                                    <option th:each="fp : ${positions}"
                                            th:value="${fp.position.positionId}"
                                            th:text="${fp.position.positionName}">Position</option>
                                </select>
                            </div>

                            <div class="d-flex gap-2">
                                <button type="submit" class="btn btn-gameon">
                                    <i class="bi bi-send me-1"></i>Send Join Request
                                </button>
                                <a th:href="@{'/listings/' + ${listing.gameListingId}}" class="btn btn-outline-secondary">Cancel</a>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div th:replace="~{fragments/layout :: scripts}"></div>
    <script>
        document.getElementById('joinRequestForm')?.addEventListener('submit', function (event) {
            const primary = document.getElementById('primaryPosition');
            const alternate = document.getElementById('alternatePosition');
            if (primary && alternate && alternate.value && !primary.value) {
                event.preventDefault();
                alert('Choose a primary position before an alternative position.');
            } else if (primary && alternate && primary.value && primary.value === alternate.value) {
                event.preventDefault();
                alert('Primary and alternative positions must be different.');
            }
        });
    </script>
</body>
</html>
