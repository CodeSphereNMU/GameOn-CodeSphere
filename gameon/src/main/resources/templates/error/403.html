<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Access Denied - GameOn</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container d-flex align-items-center justify-content-center" style="min-height: 100vh;">
        <div class="text-center">
            <h1 class="display-1 text-danger fw-bold">403</h1>
            <h2 class="mb-3">Access Denied</h2>
            <p class="text-muted mb-4" th:text="${message != null ? message : 'You do not have permission to access this page.'}">
                You do not have permission to access this page.
            </p>
            <a href="/listings" class="btn btn-danger rounded-pill px-4">Go to Listings</a>
            <a href="/login" class="btn btn-outline-secondary rounded-pill px-4 ms-2">Login</a>
        </div>
    </div>
</body>
</html>
