<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/layout :: head('Notifications')}"></head>
<body class="bg-light">
    <nav th:replace="~{fragments/layout :: navbar('none')}"></nav>
    <div th:replace="~{fragments/layout :: tabs('none')}"></div>

    <div class="container mt-4">
        <div class="d-flex justify-content-between align-items-center mb-3">
            <h4>
                Notifications
                <span th:if="${unreadCount > 0}" class="badge bg-danger ms-2" th:text="${unreadCount}">0</span>
            </h4>
            <form th:if="${unreadCount > 0}" th:action="@{/notifications/mark-all-read}" method="post">
                <button type="submit" class="btn btn-outline-gameon btn-sm">
                    <i class="bi bi-check2-all me-1"></i>Mark All Read
                </button>
            </form>
        </div>

        <!-- Flash Messages -->
        <div th:if="${success}" class="alert alert-success alert-dismissible fade show" role="alert">
            <span th:text="${success}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>
        <div th:if="${error}" class="alert alert-danger alert-dismissible fade show" role="alert">
            <span th:text="${error}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>

        <div th:if="${invitations != null && !invitations.isEmpty()}" class="card shadow-sm mb-4">
            <div class="card-header bg-white"><strong>Game Invitations</strong></div>
            <div class="list-group list-group-flush">
                <div th:each="invitation : ${invitations}"
                     class="list-group-item d-flex justify-content-between align-items-center gap-2">
                    <a th:href="@{'/listings/' + ${invitation.gameListing.gameListingId}}"
                       class="text-decoration-none flex-grow-1">
                        <strong th:text="${invitation.gameListing.format.sport.sportName + ' - ' + invitation.gameListing.format.formatName}">Game</strong>
                        <span class="text-muted ms-2" th:text="${#temporals.format(invitation.gameListing.scheduledDate, 'dd MMM yyyy HH:mm')}">Date</span>
                    </a>
                    <div class="d-flex align-items-center gap-2">
                        <a th:href="@{'/listings/' + ${invitation.gameListing.gameListingId}}"
                           class="badge bg-danger text-decoration-none">View Listing</a>
                        <form th:action="@{'/notifications/invitations/' + ${invitation.invitationId} + '/decline'}" method="post">
                            <button type="submit" class="btn btn-sm btn-outline-secondary">Decline</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>

        <!-- Notification List -->
        <div th:if="${notifications.isEmpty()}" class="text-center text-muted py-5">
            <i class="bi bi-bell-slash" style="font-size: 3rem;"></i>
            <p class="mt-2">No notifications yet</p>
        </div>

        <div class="list-group">
            <div th:each="notif : ${notifications}"
                 class="list-group-item d-flex justify-content-between align-items-start"
                 th:classappend="${(!notif.isRead ? 'list-group-item-light border-start border-danger border-3' : '') + (clickableNotificationIds.contains(notif.notificationId) ? ' notification-clickable' : '')}">
                <form th:if="${clickableNotificationIds.contains(notif.notificationId)}"
                      th:action="@{'/notifications/open/' + ${notif.notificationId}}" method="post"
                      class="notification-open-form ms-2 me-auto">
                    <button type="submit" class="notification-open-button text-start">
                        <span class="d-block d-flex align-items-center mb-1">
                            <strong class="me-2" th:text="${notif.notificationType.heading}">Notification heading</strong>
                            <small class="text-muted" th:text="${#temporals.format(notif.createdAt, 'dd MMM yyyy HH:mm')}">Date</small>
                        </span>
                        <span class="d-block mb-0" th:text="${notif.text}">Notification text</span>
                    </button>
                </form>
                <div th:unless="${clickableNotificationIds.contains(notif.notificationId)}" class="ms-2 me-auto">
                    <div class="d-flex align-items-center mb-1">
                        <strong class="me-2" th:text="${notif.notificationType.heading}">Notification heading</strong>
                        <small class="text-muted" th:text="${#temporals.format(notif.createdAt, 'dd MMM yyyy HH:mm')}">Date</small>
                    </div>
                    <p class="mb-0" th:text="${notif.text}">Notification text</p>
                </div>
                <form th:if="${!notif.isRead}" th:action="@{'/notifications/mark-read/' + ${notif.notificationId}}" method="post">
                    <button type="submit" class="btn btn-sm btn-outline-secondary" title="Mark as read">
                        <i class="bi bi-check2"></i>
                    </button>
                </form>
            </div>
        </div>

        <!-- Pagination -->
        <nav th:if="${notifications.totalPages > 1}" class="mt-4">
            <ul class="pagination justify-content-center">
                <li class="page-item" th:classappend="${notifications.first} ? 'disabled'">
                    <a class="page-link" th:href="@{/notifications(page=${notifications.number - 1})}">Previous</a>
                </li>
                <li th:each="i : ${#numbers.sequence(0, notifications.totalPages - 1)}"
                    class="page-item" th:classappend="${i == notifications.number} ? 'active'">
                    <a class="page-link" th:href="@{/notifications(page=${i})}" th:text="${i + 1}">1</a>
                </li>
                <li class="page-item" th:classappend="${notifications.last} ? 'disabled'">
                    <a class="page-link" th:href="@{/notifications(page=${notifications.number + 1})}">Next</a>
                </li>
            </ul>
        </nav>
    </div>

    <div th:replace="~{fragments/layout :: scripts}"></div>
    <style>
        .notification-open-form { flex: 1 1 auto; min-width: 0; }
        .notification-open-button {
            display: block; width: 100%; padding: 0; border: 0; background: transparent;
            color: inherit; font: inherit; cursor: pointer;
        }
        .notification-open-button:hover { color: #343a40; }
        .notification-open-button:focus-visible { outline: 2px solid #dc3545; outline-offset: 3px; border-radius: 2px; }
        .notification-clickable:hover { background-color: #f8f9fa; }
    </style>
</body>
</html>
