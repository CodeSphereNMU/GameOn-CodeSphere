<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/layout :: head('Reports')}"></head>
<body class="bg-light">
    <nav th:replace="~{fragments/layout :: navbar('none')}"></nav>

    <div class="container mt-4">
        <div class="d-flex justify-content-between align-items-center mb-3">
            <h4><i class="bi bi-shield-exclamation me-2 text-danger"></i>Pending Reports
                <span class="badge bg-danger ms-2" th:text="${pendingCount}">0</span>
            </h4>
        </div>

        <!-- Flash Messages -->
        <div th:if="${success}" class="alert alert-success alert-dismissible fade show" role="alert">
            <span th:text="${success}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>

        <div th:if="${reports.isEmpty()}" class="text-center text-muted py-5">
            <i class="bi bi-check-circle" style="font-size: 3rem;"></i>
            <p class="mt-2">No pending reports. All clear!</p>
        </div>

        <div th:unless="${reports.isEmpty()}" class="list-group">
            <div th:each="report : ${reports}" class="list-group-item">
                <div class="d-flex justify-content-between align-items-center">
                    <div>
                        <span class="badge me-2" th:classappend="${report.reportType.name() == 'USER'} ? 'bg-warning text-dark' : 'bg-info'"
                              th:text="${report.reportType}">TYPE</span>
                        <strong th:text="${report.reportReason}">Reason</strong>
                        <br>
                        <small class="text-muted">
                            Reported by <span th:text="${report.reporter.username}">Reporter</span>
                            on <span th:text="${#temporals.format(report.createdAt, 'dd MMM yyyy HH:mm')}">Date</span>
                        </small>
                        <span th:if="${report.content != null}" class="d-block small text-muted mt-1"
                              th:text="'Details: ' + ${report.content}">Content</span>
                    </div>
                    <a th:href="@{'/moderator/reports/' + ${report.reportId}}" class="btn btn-outline-gameon btn-sm">
                        View Item
                    </a>
                </div>
            </div>
        </div>

        <!-- Pagination -->
        <nav th:if="${reports.totalPages > 1}" class="mt-4">
            <ul class="pagination justify-content-center">
                <li class="page-item" th:classappend="${reports.first} ? 'disabled'">
                    <a class="page-link" th:href="@{/moderator/reports(page=${reports.number - 1})}">Previous</a>
                </li>
                <li th:each="i : ${#numbers.sequence(0, reports.totalPages - 1)}"
                    class="page-item" th:classappend="${i == reports.number} ? 'active'">
                    <a class="page-link" th:href="@{/moderator/reports(page=${i})}" th:text="${i + 1}">1</a>
                </li>
                <li class="page-item" th:classappend="${reports.last} ? 'disabled'">
                    <a class="page-link" th:href="@{/moderator/reports(page=${reports.number + 1})}">Next</a>
                </li>
            </ul>
        </nav>
    </div>

    <div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
