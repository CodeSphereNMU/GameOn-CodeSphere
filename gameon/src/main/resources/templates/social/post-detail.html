<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/layout :: head('Post')}"></head>
<body class="bg-light">
    <th:block th:replace="~{social/carousel-css :: style}"></th:block>
    <nav th:replace="~{fragments/layout :: navbar('social')}"></nav>
    <div th:replace="~{fragments/layout :: tabs('social')}"></div>

    <div class="container mt-4">
        <div class="row justify-content-center">
            <div class="col-md-8">
                <!-- Back navigation: returns to the originating page when it is a safe
                     same-origin page, otherwise falls back to the social feed. -->
                <div class="mb-3 text-end">
                    <a th:href="@{/social}" id="backButton" class="btn btn-outline-secondary btn-sm">
                        <i class="bi bi-arrow-left me-1"></i>Back
                    </a>
                </div>

                <!-- Post Card -->
                <div class="card shadow-sm mb-3">
                    <div class="card-body">
                        <div class="d-flex align-items-center mb-3">
                            <img th:if="${post.user.profilePictureUrl != null}"
                                 th:src="@{${post.user.profilePictureUrl}}"
                                 class="gameon-avatar gameon-avatar-md me-2" alt="">
                            <i th:unless="${post.user.profilePictureUrl != null}"
                               class="bi bi-person-circle fs-3 me-2 text-muted"></i>
                            <div>
                                <a th:href="@{'/profile/' + ${post.user.userId}}"
                                   class="fw-bold text-decoration-none text-dark" th:text="${post.user.username}">User</a>
                                <br>
                                <small class="text-muted" th:text="${#temporals.format(post.createdAt, 'dd MMM yyyy HH:mm')}">Date</small>
                            </div>
                        </div>
                        <p class="card-text fs-6" th:if="${post.content != null and !post.content.isEmpty()}" th:text="${post.content}">Content</p>

                        <!-- Post Images (carousel) -->
                        <div th:if="${images != null and !images.isEmpty()}" class="post-carousel mb-2"
                             th:attr="data-count=${images.size()}">
                            <div class="post-carousel-viewport">
                                <img th:each="path,iter : ${images}"
                                     th:src="@{${path}}"
                                     class="post-carousel-img"
                                     th:classappend="${iter.index == 0} ? 'active'"
                                     th:attr="data-index=${iter.index}"
                                     alt="Post image" loading="lazy">
                            </div>
                            <button type="button" class="post-carousel-btn prev" th:if="${images.size() > 1}" aria-label="Previous">
                                <i class="bi bi-chevron-left"></i>
                            </button>
                            <button type="button" class="post-carousel-btn next" th:if="${images.size() > 1}" aria-label="Next">
                                <i class="bi bi-chevron-right"></i>
                            </button>
                            <div class="post-carousel-indicator" th:if="${images.size() > 1}">
                                <span class="pos">1</span>/<span class="total" th:text="${images.size()}">1</span>
                            </div>
                            <div class="post-carousel-dots" th:if="${images.size() > 1}">
                                <span th:each="path,iter : ${images}" class="dot"
                                      th:classappend="${iter.index == 0} ? 'active'"
                                      th:attr="data-index=${iter.index}"></span>
                            </div>
                        </div>

                        <div class="d-flex gap-3 align-items-center mt-3">
                            <form th:action="@{'/social/like/' + ${post.postId}}" method="post" class="d-inline" data-like-form>
                                <button type="submit" class="btn btn-sm"
                                        data-like-btn data-like-btn-fill
                                        th:classappend="${isLiked} ? 'btn-danger' : 'btn-outline-danger'">
                                    <i class="bi me-1" data-like-icon th:classappend="${isLiked} ? 'bi-heart-fill' : 'bi-heart'"></i><span data-like-count th:text="${likeCount}">0</span> Likes
                                </button>
                            </form>
                            <span class="text-muted small"><i class="bi bi-chat me-1"></i><span th:text="${comments.size()}">0</span> Comments</span>
                        </div>
                    </div>
                </div>

                <!-- Add Comment -->
                <div class="card shadow-sm mb-3">
                    <div class="card-body">
                        <form th:action="@{'/social/comment/' + ${post.postId}}" method="post">
                            <div class="input-group">
                                <input type="text" class="form-control" name="text"
                                       placeholder="Write a comment..." required maxlength="250">
                                <button type="submit" class="btn btn-gameon">
                                    <i class="bi bi-send"></i>
                                </button>
                            </div>
                        </form>
                    </div>
                </div>

                <!-- Comments List -->
                <div th:each="comment : ${comments}" class="card shadow-sm mb-2">
                    <div class="card-body py-2">
                        <div class="d-flex justify-content-between align-items-start">
                            <div class="d-flex">
                                <img th:if="${comment.user.profilePictureUrl != null}"
                                     th:src="@{${comment.user.profilePictureUrl}}"
                                     class="gameon-avatar gameon-avatar-sm me-2 mt-1" alt="">
                                <i th:unless="${comment.user.profilePictureUrl != null}"
                                   class="bi bi-person-circle fs-5 me-2 mt-1 text-muted"></i>
                                <div>
                                    <a th:href="@{'/profile/' + ${comment.user.userId}}"
                                       class="fw-bold small text-decoration-none text-dark"
                                       th:text="${comment.user.username}">User</a>
                                    <span class="text-muted small ms-2"
                                          th:text="${#temporals.format(comment.createdAt, 'dd MMM HH:mm')}">Time</span>
                                    <p class="mb-0 small mt-1" th:text="${comment.text}">Comment text</p>
                                </div>
                            </div>
                            <form th:if="${comment.user.userId == currentUserId}"
                                  th:action="@{'/social/comment/delete/' + ${comment.commentId}}" method="post">
                                <button type="submit" class="btn btn-sm btn-link text-muted p-0" title="Delete">
                                    <i class="bi bi-x-lg"></i>
                                </button>
                            </form>
                        </div>
                    </div>
                </div>

                <div th:if="${comments.isEmpty()}" class="text-center text-muted py-3">
                    <small>No comments yet. Be the first!</small>
                </div>

            </div>
        </div>
    </div>

    <!-- Lightbox (shared) -->
    <div id="imgLightbox" class="img-lightbox">
        <button type="button" class="close-btn" aria-label="Close">&times;</button>
        <img src="" alt="Enlarged post image">
    </div>

    <div th:replace="~{fragments/layout :: scripts}"></div>
    <script th:replace="~{social/carousel-js :: script}"></script>
    <th:block th:replace="~{social/like-js :: script}"></th:block>
    <script>
    /*
     * Context-aware Back button (presentational only).
     * Default href is the safe fallback (/social) so the link always works, including with
     * JavaScript disabled, on direct access, and after a refresh or redirect. When reached
     * from another same-origin page (e.g. a notification) the href is upgraded to that
     * referrer. The current page is excluded as a target to avoid refresh/redirect loops.
     */
    (function () {
        var back = document.getElementById('backButton');
        if (!back) { return; }
        var ref = document.referrer;
        if (!ref) { return; }
        try {
            var refUrl = new URL(ref);
            if (refUrl.origin !== window.location.origin) { return; }
            if (refUrl.pathname + refUrl.search === window.location.pathname + window.location.search) { return; }
            back.setAttribute('href', refUrl.pathname + refUrl.search);
        } catch (e) {
            // Malformed referrer: keep the safe fallback href.
        }
    })();
    </script>
</body>
</html>
