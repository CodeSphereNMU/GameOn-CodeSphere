<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/layout :: head('Post')}"></head>
<body class="bg-light">
    <th:block th:replace="~{social/carousel-css :: style}"></th:block>
    <nav th:replace="~{fragments/layout :: navbar('social')}"></nav>
    <div th:replace="~{fragments/layout :: tabs('social')}"></div>

    <div class="container mt-4">
        <div class="row justify-content-center">
            <div class="col-md-8">
                <!-- Post Card -->
                <div class="card shadow-sm mb-3">
                    <div class="card-body">
                        <div class="d-flex align-items-center mb-3">
                            <i class="bi bi-person-circle fs-3 me-2 text-muted"></i>
                            <div>
                                <a th:href="@{'/profile/' + ${post.user.userId}}"
                                   class="fw-bold text-decoration-none text-dark" th:text="${post.user.username}">User</a>
                                <br>
                                <small class="text-muted" th:text="${#temporals.format(post.createdAt, 'dd MMM yyyy HH:mm')}">Date</small>
                            </div>
                        </div>
                        <p class="card-text fs-6" th:if="${post.content != null and !post.content.isEmpty()}" th:text="${post.content}">Content</p>

                        <!-- Post Images (carousel) -->
                        <div th:if="${images != null and !images.isEmpty()}" class="post-carousel mb-2"
                             th:attr="data-count=${images.size()}">
                            <div class="post-carousel-viewport">
                                <img th:each="path,iter : ${images}"
                                     th:src="@{${path}}"
                                     class="post-carousel-img"
                                     th:classappend="${iter.index == 0} ? 'active'"
                                     th:attr="data-index=${iter.index}"
                                     alt="Post image" loading="lazy">
                            </div>
                            <button type="button" class="post-carousel-btn prev" th:if="${images.size() > 1}" aria-label="Previous">
                                <i class="bi bi-chevron-left"></i>
                            </button>
                            <button type="button" class="post-carousel-btn next" th:if="${images.size() > 1}" aria-label="Next">
                                <i class="bi bi-chevron-right"></i>
                            </button>
                            <div class="post-carousel-indicator" th:if="${images.size() > 1}">
                                <span class="pos">1</span>/<span class="total" th:text="${images.size()}">1</span>
                            </div>
                            <div class="post-carousel-dots" th:if="${images.size() > 1}">
                                <span th:each="path,iter : ${images}" class="dot"
                                      th:classappend="${iter.index == 0} ? 'active'"
                                      th:attr="data-index=${iter.index}"></span>
                            </div>
                        </div>

                        <div class="d-flex gap-3 align-items-center mt-3">
                            <form th:action="@{'/social/like/' + ${post.postId}}" method="post" class="d-inline">
                                <button type="submit" class="btn btn-sm" th:classappend="${isLiked} ? 'btn-danger' : 'btn-outline-danger'">
                                    <i class="bi bi-heart-fill me-1"></i><span th:text="${likeCount}">0</span> Likes
                                </button>
                            </form>
                            <span class="text-muted small"><i class="bi bi-chat me-1"></i><span th:text="${comments.size()}">0</span> Comments</span>
                        </div>
                    </div>
                </div>

                <!-- Add Comment -->
                <div class="card shadow-sm mb-3">
                    <div class="card-body">
                        <form th:action="@{'/social/comment/' + ${post.postId}}" method="post">
                            <div class="input-group">
                                <input type="text" class="form-control" name="text"
                                       placeholder="Write a comment..." required maxlength="250">
                                <button type="submit" class="btn btn-gameon">
                                    <i class="bi bi-send"></i>
                                </button>
                            </div>
                        </form>
                    </div>
                </div>

                <!-- Comments List -->
                <div th:each="comment : ${comments}" class="card shadow-sm mb-2">
                    <div class="card-body py-2">
                        <div class="d-flex justify-content-between align-items-start">
                            <div>
                                <a th:href="@{'/profile/' + ${comment.user.userId}}"
                                   class="fw-bold small text-decoration-none text-dark"
                                   th:text="${comment.user.username}">User</a>
                                <span class="text-muted small ms-2"
                                      th:text="${#temporals.format(comment.createdAt, 'dd MMM HH:mm')}">Time</span>
                                <p class="mb-0 small mt-1" th:text="${comment.text}">Comment text</p>
                            </div>
                            <form th:if="${comment.user.userId == currentUserId}"
                                  th:action="@{'/social/comment/delete/' + ${comment.commentId}}" method="post">
                                <button type="submit" class="btn btn-sm btn-link text-muted p-0" title="Delete">
                                    <i class="bi bi-x-lg"></i>
                                </button>
                            </form>
                        </div>
                    </div>
                </div>

                <div th:if="${comments.isEmpty()}" class="text-center text-muted py-3">
                    <small>No comments yet. Be the first!</small>
                </div>

                <a th:href="@{/social}" class="btn btn-outline-secondary btn-sm mt-3">
                    <i class="bi bi-arrow-left me-1"></i>Back to Feed
                </a>
            </div>
        </div>
    </div>

    <!-- Lightbox (shared) -->
    <div id="imgLightbox" class="img-lightbox">
        <button type="button" class="close-btn" aria-label="Close">&times;</button>
        <img src="" alt="Enlarged post image">
    </div>

    <div th:replace="~{fragments/layout :: scripts}"></div>
    <script th:replace="~{social/carousel-js :: script}"></script>
</body>
</html>
