<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<!--
  Shared carousel + lightbox styles for Social Feed post images.
  Usage: <th:block th:replace="~{social/carousel-css :: style}"></th:block>
-->
<th:block th:fragment="style">
<style>
    .post-carousel {
        position: relative;
        width: 100%;
        background: #f1f3f5;
        border-radius: .5rem;
        overflow: hidden;
    }
    .post-carousel-viewport {
    position: relative;
    width: 100%;
    height: 240px;
    display: flex;
    align-items: center;
    justify-content: center;
    }
    .post-carousel-img {
    display: none;
    width: 100%;
    height: 100%;
    object-fit: contain;
    cursor: zoom-in;
    }
    .post-carousel-img.active { display: block; }
    @media (max-width: 575.98px) {
    .post-carousel-viewport {
        height: 260px;
    }
    }
    .post-carousel-btn {
        position: absolute;
        top: 50%;
        transform: translateY(-50%);
        border: none;
        background: rgba(0,0,0,.45);
        color: #fff;
        width: 38px;
        height: 38px;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
    }
    .post-carousel-btn.prev { left: 8px; }
    .post-carousel-btn.next { right: 8px; }
    .post-carousel-btn:hover { background: rgba(0,0,0,.65); }
    .post-carousel-indicator {
        position: absolute;
        top: 8px;
        right: 10px;
        background: rgba(0,0,0,.55);
        color: #fff;
        font-size: .75rem;
        padding: 2px 8px;
        border-radius: 10px;
    }
    .post-carousel-dots {
        position: absolute;
        bottom: 8px;
        left: 0;
        right: 0;
        display: flex;
        gap: 6px;
        justify-content: center;
    }
    .post-carousel-dots .dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: rgba(255,255,255,.6);
        box-shadow: 0 0 2px rgba(0,0,0,.5);
    }
    .post-carousel-dots .dot.active { background: #fff; }
    .img-lightbox {
        position: fixed;
        inset: 0;
        background: rgba(0,0,0,.85);
        display: none;
        align-items: center;
        justify-content: center;
        z-index: 1080;
        cursor: zoom-out;
    }
    .img-lightbox.open { display: flex; }
    .img-lightbox img {
        max-width: 92vw;
        max-height: 92vh;
        object-fit: contain;
    }
    .img-lightbox .close-btn {
        position: absolute;
        top: 16px;
        right: 20px;
        color: #fff;
        font-size: 2rem;
        background: none;
        border: none;
        cursor: pointer;
    }
</style>
</th:block>
</head>
</html>
