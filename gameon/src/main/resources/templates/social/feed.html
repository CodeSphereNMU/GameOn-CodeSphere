<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/layout :: head('Social')}"></head>
<body class="bg-light">
    <th:block th:replace="~{social/carousel-css :: style}"></th:block>
    <nav th:replace="~{fragments/layout :: navbar('social')}"></nav>
    <div th:replace="~{fragments/layout :: tabs('social')}"></div>

    <div class="container mt-4">
        <div class="row justify-content-center">
            <div class="col-md-8">
                <!-- Header + Create -->
                <div class="d-flex justify-content-between align-items-center mb-3">
                    <h4>Social Feed</h4>
                    <a th:href="@{/social/create}" class="btn btn-gameon">
                        <i class="bi bi-plus-lg me-1"></i>Create Post
                    </a>
                </div>

                <!-- Visibility Filter -->
                <div class="card shadow-sm mb-3">
                    <div class="card-body py-2">
                        <div class="d-flex flex-wrap align-items-center gap-2">
                            <span class="text-muted me-1"><i class="bi bi-funnel me-1"></i>Filter:</span>
                            <a th:href="@{/social(filter='ALL')}"
                               class="btn btn-sm"
                               th:classappend="${currentFilter == 'ALL' || currentFilter == null} ? 'btn-danger text-white' : 'btn-outline-secondary'">
                                All Visible Posts
                            </a>
                            <a th:href="@{/social(filter='PUBLIC')}"
                               class="btn btn-sm"
                               th:classappend="${currentFilter == 'PUBLIC'} ? 'btn-danger text-white' : 'btn-outline-secondary'">
                                <i class="bi bi-globe me-1"></i>Public Posts
                            </a>
                            <a th:href="@{/social(filter='FOLLOWERS')}"
                               class="btn btn-sm"
                               th:classappend="${currentFilter == 'FOLLOWERS'} ? 'btn-danger text-white' : 'btn-outline-secondary'">
                                <i class="bi bi-people me-1"></i>Followers Only
                            </a>
                            <a th:href="@{/social(filter='MY_POSTS')}"
                               class="btn btn-sm"
                               th:classappend="${currentFilter == 'MY_POSTS'} ? 'btn-danger text-white' : 'btn-outline-secondary'">
                                <i class="bi bi-person me-1"></i>My Posts
                            </a>
                        </div>
                    </div>
                </div>

                <!-- Flash Messages -->
                <div th:if="${success}" class="alert alert-success alert-dismissible fade show" role="alert">
                    <span th:text="${success}"></span>
                    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                </div>
                <div th:if="${error}" class="alert alert-danger alert-dismissible fade show" role="alert">
                    <span th:text="${error}"></span>
                    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                </div>

                <!-- Posts -->
                <div th:if="${posts.isEmpty()}" class="text-center text-muted py-5">
                    <i class="bi bi-chat-square-text" style="font-size: 3rem;"></i>
                    <p class="mt-2">No posts yet. Create one or follow other users to see their posts!</p>
                </div>

                <div th:each="post : ${posts}" class="card shadow-sm mb-3">
                    <div class="card-body">
                        <!-- Post Header -->
                        <div class="d-flex justify-content-between align-items-start mb-2">
                            <div class="d-flex align-items-center">
                                <img th:if="${post.authorProfilePictureUrl != null}"
                                     th:src="@{${post.authorProfilePictureUrl}}"
                                     class="gameon-avatar gameon-avatar-md me-2" alt="">
                                <i th:unless="${post.authorProfilePictureUrl != null}"
                                   class="bi bi-person-circle fs-4 me-2 text-muted"></i>
                                <div>
                                    <a th:href="@{'/profile/' + ${post.userId}}"
                                       class="fw-bold text-decoration-none text-dark"
                                       th:text="${post.username}">Username</a>
                                    <br>
                                    <small class="text-muted" th:text="${#temporals.format(post.createdAt, 'dd MMM yyyy HH:mm')}">Date</small>
                                </div>
                            </div>
                            <!-- Post Actions (own post) -->
                            <div th:if="${post.userId == currentUserId}" class="dropdown">
                                <button class="btn btn-sm btn-link text-muted" data-bs-toggle="dropdown">
                                    <i class="bi bi-three-dots-vertical"></i>
                                </button>
                                <ul class="dropdown-menu dropdown-menu-end">
                                    <li><a class="dropdown-item" th:href="@{'/social/edit/' + ${post.postId}}">
                                        <i class="bi bi-pencil me-2"></i>Edit</a></li>
                                    <li>
                                        <form th:action="@{'/social/delete/' + ${post.postId}}" method="post"
                                              data-confirm="This post will be permanently deleted."
                                              data-confirm-title="Delete post?"
                                              data-confirm-ok="Delete"
                                              data-confirm-cancel="Keep Post">
                                            <button type="submit" class="dropdown-item text-danger">
                                                <i class="bi bi-trash me-2"></i>Delete
                                            </button>
                                        </form>
                                    </li>
                                </ul>
                            </div>
                            <!-- Report (other's post) -->
                            <div th:unless="${post.userId == currentUserId}">
                                <a th:href="@{'/report/post/' + ${post.postId}}" class="btn btn-sm btn-link text-muted" title="Report">
                                    <i class="bi bi-flag"></i>
                                </a>
                            </div>
                        </div>

                        <!-- Post Content -->
                        <p class="card-text" th:if="${post.content != null and !post.content.isEmpty()}" th:text="${post.content}">Content here</p>

                        <!-- Post Images (carousel) -->
                        <div th:if="${post.hasImages}" class="post-carousel mb-2"
                             th:attr="data-count=${post.imageCount}">
                            <div class="post-carousel-viewport">
                                <img th:each="path,iter : ${post.imagePaths}"
                                     th:src="@{${path}}"
                                     class="post-carousel-img"
                                     th:classappend="${iter.index == 0} ? 'active'"
                                     th:attr="data-index=${iter.index}"
                                     alt="Post image" loading="lazy">
                            </div>
                            <button type="button" class="post-carousel-btn prev" th:if="${post.imageCount > 1}" aria-label="Previous">
                                <i class="bi bi-chevron-left"></i>
                            </button>
                            <button type="button" class="post-carousel-btn next" th:if="${post.imageCount > 1}" aria-label="Next">
                                <i class="bi bi-chevron-right"></i>
                            </button>
                            <div class="post-carousel-indicator" th:if="${post.imageCount > 1}">
                                <span class="pos">1</span>/<span class="total" th:text="${post.imageCount}">1</span>
                            </div>
                            <div class="post-carousel-dots" th:if="${post.imageCount > 1}">
                                <span th:each="path,iter : ${post.imagePaths}" class="dot"
                                      th:classappend="${iter.index == 0} ? 'active'"
                                      th:attr="data-index=${iter.index}"></span>
                            </div>
                        </div>

                        <!-- Privacy badge -->
                        <small class="text-muted">
                            <i th:classappend="${post.privacySetting.name() == 'PUBLIC'} ? 'bi-globe' : 'bi-people'"
                               class="bi me-1"></i>
                            <span th:text="${post.privacySetting}">Public</span>
                        </small>

                        <!-- Like + Comment bar -->
                        <hr class="my-2">
                        <div class="d-flex gap-3 align-items-center">
                            <form th:action="@{'/social/like/' + ${post.postId}}" method="post" class="d-inline">
                                <input type="hidden" name="page" th:value="${posts.number}">
                                <input type="hidden" name="filter" th:value="${currentFilter}">
                                <button type="submit" class="btn btn-sm btn-link text-decoration-none p-0">
                                    <i class="bi bi-heart-fill text-danger me-1"></i>
                                    <span th:text="${post.likeCount}">0</span>
                                </button>
                            </form>
                            <a th:href="@{'/social/post/' + ${post.postId}}" class="btn btn-sm btn-link text-decoration-none text-muted p-0">
                                <i class="bi bi-chat me-1"></i>
                                <span th:text="${post.commentCount}">0</span> Comments
                            </a>
                        </div>
                    </div>
                </div>

                <!-- Pagination -->
                <nav th:if="${posts.totalPages > 1}" class="mt-4">
                    <ul class="pagination justify-content-center">
                        <li class="page-item" th:classappend="${posts.first} ? 'disabled'">
                            <a class="page-link" th:href="@{/social(page=${posts.number - 1}, filter=${currentFilter})}">Previous</a>
                        </li>
                        <li th:each="i : ${#numbers.sequence(0, posts.totalPages - 1)}"
                            class="page-item" th:classappend="${i == posts.number} ? 'active'">
                            <a class="page-link" th:href="@{/social(page=${i}, filter=${currentFilter})}" th:text="${i + 1}">1</a>
                        </li>
                        <li class="page-item" th:classappend="${posts.last} ? 'disabled'">
                            <a class="page-link" th:href="@{/social(page=${posts.number + 1}, filter=${currentFilter})}">Next</a>
                        </li>
                    </ul>
                </nav>
            </div>
        </div>
    </div>

    <!-- Lightbox (shared) -->
    <div id="imgLightbox" class="img-lightbox">
        <button type="button" class="close-btn" aria-label="Close">&times;</button>
        <img src="" alt="Enlarged post image">
    </div>

    <div th:replace="~{fragments/layout :: scripts}"></div>
    <script th:replace="~{social/carousel-js :: script}"></script>
</body>
</html>
