<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/layout :: head('Leaderboard')}"></head>
<body class="gameon-page">
    <nav th:replace="~{fragments/layout :: navbar('social')}"></nav>
    <div class="gameon-container">
    <div th:replace="~{fragments/layout :: tabs('social')}"></div>

    <div class="container mt-4">
        <div class="d-flex justify-content-between align-items-center mb-3">
            <h4><i class="bi bi-trophy-fill text-warning me-2"></i>Leaderboard</h4>
        </div>

        <!-- Sport Filter -->
        <div class="mb-4">
            <form th:action="@{/leaderboard}" method="get" class="d-flex gap-2 align-items-center">
                <label class="form-label mb-0 fw-bold">Sport:</label>
                <select name="sportId" class="form-select form-select-sm" style="width: auto;" onchange="this.form.submit()">
                    <option th:each="sport : ${sports}" th:value="${sport.sportId}" th:text="${sport.sportName}"
                            th:selected="${sport.sportId == selectedSportId}">Sport</option>
                </select>
            </form>
        </div>

        <!-- Rankings Table -->
        <div th:if="${rankings != null && !rankings.isEmpty()}" class="card shadow-sm">
            <div class="table-responsive">
                <table class="table table-hover mb-0">
                    <thead class="table-dark">
                        <tr>
                            <th style="width: 60px;">#</th>
                            <th>Player</th>
                            <th>Skill</th>
                            <th class="text-center">W</th>
                            <th class="text-center">L</th>
                            <th class="text-center">Win %</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="profile, iter : ${rankings}">
                            <td>
                                <span th:if="${iter.index == 0}" class="badge bg-warning text-dark">1st</span>
                                <span th:if="${iter.index == 1}" class="badge bg-secondary">2nd</span>
                                <span th:if="${iter.index == 2}" class="badge bg-danger">3rd</span>
                                <span th:if="${iter.index > 2}" th:text="${iter.index + 1}">4</span>
                            </td>
                            <td>
                                <a th:href="@{'/profile/' + ${profile.user.userId}}"
                                   class="text-decoration-none text-dark fw-bold"
                                   th:text="${profile.user.username}">Player</a>
                            </td>
                            <td>
                                <span class="badge badge-skill"
                                      th:classappend="${profile.skillLevel.name() == 'BEGINNER'} ? 'bg-success' : (${profile.skillLevel.name() == 'INTERMEDIATE'} ? 'bg-warning text-dark' : 'bg-danger')"
                                      th:text="${profile.skillLevel}">Level</span>
                            </td>
                            <td class="text-center" th:text="${profile.wins}">0</td>
                            <td class="text-center" th:text="${profile.losses}">0</td>
                            <td class="text-center fw-bold" th:text="${#numbers.formatDecimal(profile.winPercentage, 1, 1) + '%'}">0%</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>

        <div th:if="${rankings == null || rankings.isEmpty()}" class="text-center text-muted py-5">
            <i class="bi bi-trophy" style="font-size: 3rem;"></i>
            <p class="mt-2">No rankings yet for this sport. Play some games to appear on the leaderboard!</p>
        </div>
    </div>

    </div><!-- /.gameon-container -->

    <div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
