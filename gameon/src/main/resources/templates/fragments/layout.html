<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<!-- ===== HEAD FRAGMENT ===== -->
<head th:fragment="head(title)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${title} + ' - GameOn'">GameOn</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        :root { --gameon-red: #DC3545; --gameon-dark: #1a1a2e; }
        .navbar-brand { font-style: italic; font-weight: 800; color: var(--gameon-red) !important; font-size: 1.5rem; }
        .nav-tabs .nav-link.active { color: var(--gameon-red); border-bottom: 3px solid var(--gameon-red); font-weight: 600; }
        .nav-tabs .nav-link { color: #6c757d; border: none; padding: 0.75rem 1.25rem; }
        .nav-tabs .nav-link:hover { color: var(--gameon-red); }
        .btn-gameon { background-color: var(--gameon-red); border-color: var(--gameon-red); border-radius: 25px; color: #fff; }
        .btn-gameon:hover { background-color: #bb2d3b; border-color: #bb2d3b; color: #fff; }
        .btn-outline-gameon { border-color: var(--gameon-red); color: var(--gameon-red); border-radius: 25px; }
        .btn-outline-gameon:hover { background-color: var(--gameon-red); color: #fff; }
        .card { border-radius: 12px; border: 1px solid #e9ecef; }
        .badge-skill { font-size: 0.7rem; padding: 4px 8px; border-radius: 10px; }
        .notification-badge { position: absolute; top: -5px; right: -8px; font-size: 0.65rem; }
    </style>
</head>

<!-- ===== NAVBAR FRAGMENT ===== -->
<nav th:fragment="navbar(activeTab)" class="navbar navbar-expand-lg navbar-dark bg-dark sticky-top">
    <div class="container">
        <a class="navbar-brand" th:href="@{/listings}">GAME ON</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navContent">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navContent">
            <ul class="navbar-nav ms-auto align-items-center">
                <li class="nav-item me-3 position-relative">
                    <a th:href="@{/notifications}" class="nav-link text-white p-2">
                        <i class="bi bi-bell fs-5"></i>
                        <span class="badge bg-danger notification-badge rounded-pill"
                              th:if="${unreadNotificationCount != null && unreadNotificationCount > 0}"
                              th:text="${unreadNotificationCount}">0</span>
                    </a>
                </li>
                <li class="nav-item dropdown">
                    <a class="nav-link dropdown-toggle text-white" href="#" role="button" data-bs-toggle="dropdown">
                        <i class="bi bi-person-circle fs-5 me-1"></i>
                        <span sec:authentication="name">User</span>
                    </a>
                    <ul class="dropdown-menu dropdown-menu-end">
                        <li><a class="dropdown-item" th:href="@{/profile}"><i class="bi bi-person me-2"></i>My Profile</a></li>
                        <li><hr class="dropdown-divider"></li>
                        <li>
                            <form th:action="@{/logout}" method="post" class="d-inline w-100">
                                <button type="submit" class="dropdown-item text-danger">
                                    <i class="bi bi-box-arrow-right me-2"></i>Logout
                                </button>
                            </form>
                        </li>
                    </ul>
                </li>
            </ul>
        </div>
    </div>
</nav>

<!-- ===== TABS FRAGMENT ===== -->
<div th:fragment="tabs(activeTab)" class="container mt-3">
    <ul class="nav nav-tabs">
        <li class="nav-item">
            <a class="nav-link" th:classappend="${activeTab == 'listings'} ? 'active'" th:href="@{/listings}">Listings</a>
        </li>
        <li class="nav-item">
            <a class="nav-link" th:classappend="${activeTab == 'social'} ? 'active'" th:href="@{/social}">Social</a>
        </li>
        <li class="nav-item">
            <a class="nav-link" th:classappend="${activeTab == 'lobby'} ? 'active'" th:href="@{/lobby}">Lobby</a>
        </li>
    </ul>
</div>

<!-- ===== SCRIPTS FRAGMENT ===== -->
<div th:fragment="scripts">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</div>

</html>
