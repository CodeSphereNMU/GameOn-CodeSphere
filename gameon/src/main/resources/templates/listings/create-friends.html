<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Invite Friends')}"></head>
<body class="bg-light">
<nav th:replace="~{fragments/layout :: navbar('listings')}"></nav>
<div th:replace="~{fragments/layout :: tabs('listings')}"></div>
<div class="container mt-4"><div class="row justify-content-center"><div class="col-md-7">
    <div class="card shadow-sm">
        <div class="card-header bg-white">
            <h5 class="mb-0">Invite Friends</h5>
            <small class="text-muted" th:text="${format.hasPositions ? 'Step 3 - Optional invitations' : 'Step 2 - Optional invitations'}"></small>
        </div>
        <div class="card-body">
            <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>
            <p class="small text-muted">Invited users must still submit a join request.</p>
            <form th:action="@{/listings/create/friends}" method="post">
                <div th:if="${friends.isEmpty()}" class="alert alert-light border">You are not following anyone to invite yet. You can continue without invitations.</div>
                <div th:unless="${friends.isEmpty()}" class="list-group mb-3">
                    <label th:each="friend : ${friends}" class="list-group-item">
                        <input class="form-check-input me-2" type="checkbox" name="invitedFriendIds"
                               th:value="${friend.userId}" th:checked="${draft.invitedFriendIds.contains(friend.userId)}">
                        <span th:text="${friend.username}">Friend</span>
                    </label>
                </div>
                <div class="d-flex gap-2">
                    <a th:if="${format.hasPositions}" th:href="@{/listings/create/positions}" class="btn btn-outline-secondary">Back</a>
                    <a th:unless="${format.hasPositions}" th:href="@{/listings/create}" class="btn btn-outline-secondary">Back</a>
                    <button type="submit" class="btn btn-gameon">Next <i class="bi bi-arrow-right"></i></button>
                </div>
            </form>
        </div>
    </div>
</div></div></div>
<div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
