<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/layout :: head('Listing Detail')}"></head>
<body class="bg-light">
    <nav th:replace="~{fragments/layout :: navbar('listings')}"></nav>
    <div th:replace="~{fragments/layout :: tabs('listings')}"></div>

    <div class="container mt-4">
        <div class="row">
            <!-- Listing Info -->
            <div class="col-md-5">
                <div class="card shadow-sm">
                    <div class="card-header bg-white d-flex justify-content-between align-items-center">
                        <h5 class="mb-0" th:text="${listing.format.sport.sportName}">Sport</h5>
                        <span class="badge badge-skill"
                              th:classappend="${listing.skillLevel.name() == 'BEGINNER'} ? 'bg-success' : (${listing.skillLevel.name() == 'INTERMEDIATE'} ? 'bg-warning text-dark' : 'bg-danger')"
                              th:text="${listing.skillLevel}">Level</span>
                    </div>
                    <div class="card-body">
                        <p><i class="bi bi-controller me-2"></i><strong>Format:</strong> <span th:text="${listing.format.formatName}">Format</span> (<span th:text="${listing.format.noPlayers}">0</span> players)</p>
                        <p><i class="bi bi-calendar me-2"></i><strong>Date:</strong> <span th:text="${#temporals.format(listing.scheduledDate, 'dd MMM yyyy HH:mm')}">Date</span></p>
                        <p><i class="bi bi-geo-alt me-2"></i><strong>Location:</strong> <span th:text="${listing.location}">Location</span></p>
                        <p><i class="bi bi-person me-2"></i><strong>Created by:</strong>
                            <a th:href="@{'/profile/' + ${listing.creator.userId}}" th:text="${listing.creator.username}">User</a>
                        </p>
                        <p><i class="bi bi-eye me-2"></i><strong>Privacy:</strong> <span th:text="${listing.privacySetting}">Public</span></p>
                    </div>
                </div>
            </div>

            <!-- Teams / Join Section -->
            <div class="col-md-7">
                <div class="card shadow-sm">
                    <div class="card-header bg-white">
                        <h5 class="mb-0">Teams</h5>
                    </div>
                    <div class="card-body">
                        <div class="row">
                            <!-- Team A -->
                            <div class="col-6">
                                <h6 class="text-center text-danger">Team A</h6>
                                <ul class="list-group list-group-flush">
                                    <li class="list-group-item small" th:text="${listing.creator.username}">
                                        Creator (auto)
                                    </li>
                                    <li th:each="joiner : ${listing.joiners}"
                                        th:if="${joiner.team.name() == 'A' && (joiner.status.name() == 'ACCEPTED' || joiner.status.name() == 'LOCKED')}"
                                        class="list-group-item small" th:text="${joiner.user.username}">Player</li>
                                </ul>
                            </div>
                            <!-- Team B -->
                            <div class="col-6">
                                <h6 class="text-center text-primary">Team B</h6>
                                <ul class="list-group list-group-flush">
                                    <li th:each="joiner : ${listing.joiners}"
                                        th:if="${joiner.team.name() == 'B' && (joiner.status.name() == 'ACCEPTED' || joiner.status.name() == 'LOCKED')}"
                                        class="list-group-item small" th:text="${joiner.user.username}">Player</li>
                                    <li th:if="${#lists.isEmpty(listing.joiners)}" class="list-group-item small text-muted">No players yet</li>
                                </ul>
                            </div>
                        </div>

                        <!-- Join Button (not own listing) -->
                        <div th:unless="${isCreator}" class="mt-4 text-center">
                            <form th:action="@{'/game-joiner/join/' + ${listing.gameListingId}}" method="get">
                                <button type="submit" class="btn btn-gameon">
                                    <i class="bi bi-person-plus me-1"></i>Join This Game
                                </button>
                            </form>
                        </div>

                        <!-- Manage Listing (creator) -->
                        <div th:if="${isCreator}" class="mt-4 text-center">
                            <a th:href="@{'/lobby/requests/' + ${listing.gameListingId}}" class="btn btn-outline-gameon btn-sm">
                                <i class="bi bi-people me-1"></i>View Join Requests
                            </a>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="mt-3">
            <a th:href="@{/listings}" class="btn btn-outline-secondary btn-sm">
                <i class="bi bi-arrow-left me-1"></i>Back to Listings
            </a>
        </div>
    </div>

    <div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
