<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/layout :: head('Edit Listing')}"></head>
<body class="bg-light">
    <nav th:replace="~{fragments/layout :: navbar('lobby')}"></nav>
    <div th:replace="~{fragments/layout :: tabs('lobby')}"></div>

    <div class="container mt-4">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card shadow-sm">
                    <div class="card-header bg-white">
                        <h5 class="mb-0"><i class="bi bi-pencil me-2"></i>Edit Listing</h5>
                        <small class="text-muted" th:text="${listing.format.sport.sportName + ' - ' + listing.format.formatName}">Sport</small>
                    </div>
                    <div class="card-body">
                        <form th:action="@{'/listings/' + ${listing.gameListingId} + '/edit'}" method="post">
                            <div class="mb-3">
                                <label for="scheduledDate" class="form-label">Date &amp; Time</label>
                                <input type="datetime-local" class="form-control" id="scheduledDate"
                                       name="scheduledDate"
                                       th:value="${#temporals.format(listing.scheduledDate, 'yyyy-MM-dd''T''HH:mm')}">
                            </div>
                            <div class="mb-3">
                                <label for="location" class="form-label">Location</label>
                                <input type="text" class="form-control" id="location" name="location"
                                       th:value="${listing.location}" maxlength="200">
                            </div>
                            <div class="mb-3">
                                <label for="skillLevel" class="form-label">Skill Level</label>
                                <select class="form-select" id="skillLevel" name="skillLevel">
                                    <option th:each="level : ${skillLevels}" th:value="${level}" th:text="${level}"
                                            th:selected="${level == listing.skillLevel}">Level</option>
                                </select>
                            </div>
                            <div class="mb-3">
                                <label for="privacySetting" class="form-label">Privacy</label>
                                <select class="form-select" id="privacySetting" name="privacySetting">
                                    <option value="PUBLIC" th:selected="${listing.privacySetting.name() == 'PUBLIC'}">Public</option>
                                    <option value="PRIVATE" th:selected="${listing.privacySetting.name() == 'PRIVATE'}">Private</option>
                                </select>
                            </div>
                            <div class="d-flex gap-2">
                                <button type="submit" class="btn btn-gameon">Save Changes</button>
                                <a th:href="@{'/listings/' + ${listing.gameListingId}}" class="btn btn-outline-secondary">Cancel</a>
                            </div>
                        </form>

                        <hr class="my-4">

                        <!-- Delete Listing -->
                        <form th:action="@{'/listings/' + ${listing.gameListingId} + '/delete'}" method="post"
                              onsubmit="return confirm('Are you sure you want to delete this listing? All joiners will be notified and removed.')">
                            <button type="submit" class="btn btn-outline-danger w-100">
                                <i class="bi bi-trash me-1"></i>Delete Listing
                            </button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
