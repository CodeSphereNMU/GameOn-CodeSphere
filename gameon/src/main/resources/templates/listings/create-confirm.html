<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Confirm Listing')}"></head>
<body class="bg-light">
<nav th:replace="~{fragments/layout :: navbar('listings')}"></nav>
<div th:replace="~{fragments/layout :: tabs('listings')}"></div>
<div class="container mt-4"><div class="row justify-content-center"><div class="col-md-7">
    <div class="card shadow-sm">
        <div class="card-header bg-white">
            <h5 class="mb-0"><i class="bi bi-check-circle me-2 text-success"></i>Confirm Listing</h5>
            <small class="text-muted">Final step - Preview the listing before creating it</small>
        </div>
        <div class="card-body">
            <div th:if="${error}" class="alert alert-danger">
                <span th:text="${error}"></span>
                <div class="small mt-2">Your draft has been kept. Go back to change the relevant information.</div>
            </div>
            <div class="card bg-light mb-4"><div class="card-body">
                <h5 th:text="${format.sport.sportName + ' - ' + format.formatName}">Sport Format</h5>
                <p class="mb-1"><i class="bi bi-people me-1"></i><span th:text="${format.noPlayers}"></span> players</p>
                <p class="mb-1"><i class="bi bi-bar-chart me-1"></i>Skill: <span th:text="${draft.skillLevel}"></span></p>
                <p class="mb-1"><i class="bi bi-calendar me-1"></i><span th:text="${#temporals.format(draft.scheduledDate, 'dd MMM yyyy HH:mm')}"></span></p>
                <p class="mb-1"><i class="bi bi-clock me-1"></i>Duration: <span th:text="${draft.durationMinutes}"></span> minutes</p>
                <p class="mb-1"><i class="bi bi-geo-alt me-1"></i><span th:text="${draft.location}"></span></p>
                <p class="mb-1"><i class="bi bi-eye me-1"></i><span th:text="${draft.privacySetting}"></span></p>
                <p th:if="${format.hasPositions}" class="mb-1">
                    <i class="bi bi-person-badge me-1"></i>Positions:
                    <span th:if="${draft.positionIds.isEmpty()}">Any Position</span>
                    <th:block th:unless="${draft.positionIds.isEmpty()}"><th:block
                        th:each="positionId, stat : ${draft.positionIds}"><span
                        th:text="${positionNames.get(positionId)}"></span><span
                        th:if="${!stat.last}">, </span></th:block></th:block>
                </p>
                <p class="mb-0"><i class="bi bi-envelope me-1"></i>Friends invited: <span th:text="${draft.invitedFriendIds.size()}"></span></p>
            </div></div>
            <form th:action="@{/listings/confirm}" method="post">
                <div class="d-flex gap-2">
                    <a th:href="@{/listings/create/friends}" class="btn btn-outline-secondary">Back</a>
                    <button type="submit" class="btn btn-gameon"><i class="bi bi-check-lg me-1"></i>Create Listing</button>
                </div>
            </form>
        </div>
    </div>
</div></div></div>
<div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
