<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Listings - GameOn</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        .navbar-brand { font-style: italic; font-weight: 800; color: #DC3545 !important; font-size: 1.5rem; }
        .nav-tabs .nav-link.active { color: #DC3545; border-bottom: 3px solid #DC3545; }
        .nav-tabs .nav-link { color: #6c757d; border: none; }
        .btn-gameon { background-color: #DC3545; border-color: #DC3545; border-radius: 25px; color: #fff; }
        .btn-gameon:hover { background-color: #bb2d3b; color: #fff; }
    </style>
</head>
<body class="bg-light">
    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="/listings">GAME ON</a>
            <div class="d-flex align-items-center">
                <a href="/notifications" class="text-white me-3 position-relative">
                    <i class="bi bi-bell fs-5"></i>
                </a>
                <div class="dropdown">
                    <a class="text-white dropdown-toggle text-decoration-none" href="#" role="button"
                       data-bs-toggle="dropdown" aria-expanded="false">
                        <i class="bi bi-person-circle fs-5"></i>
                        <span sec:authentication="name" class="ms-1">User</span>
                    </a>
                    <ul class="dropdown-menu dropdown-menu-end">
                        <li><a class="dropdown-item" href="/profile"><i class="bi bi-person me-2"></i>My Profile</a></li>
                        <li><hr class="dropdown-divider"></li>
                        <li>
                            <form th:action="@{/logout}" method="post" class="d-inline">
                                <button type="submit" class="dropdown-item text-danger">
                                    <i class="bi bi-box-arrow-right me-2"></i>Logout
                                </button>
                            </form>
                        </li>
                    </ul>
                </div>
            </div>
        </div>
    </nav>

    <!-- Tab Navigation -->
    <div class="container mt-3">
        <ul class="nav nav-tabs">
            <li class="nav-item">
                <a class="nav-link active" href="/listings">Listings</a>
            </li>
            <li class="nav-item">
                <a class="nav-link" href="/social">Social</a>
            </li>
            <li class="nav-item">
                <a class="nav-link" href="/lobby">Lobby</a>
            </li>
        </ul>
    </div>

    <!-- Content -->
    <div class="container mt-4">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h3>Available Game Listings</h3>
            <a href="/listings/create" class="btn btn-gameon">
                <i class="bi bi-plus-lg me-1"></i> Create Listing
            </a>
        </div>

        <!-- Success flash message -->
        <div th:if="${success}" class="alert alert-success alert-dismissible fade show" role="alert">
            <span th:text="${success}">Success</span>
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
        </div>

        <!-- Placeholder content -->
        <div class="text-center py-5">
            <i class="bi bi-trophy text-muted" style="font-size: 4rem;"></i>
            <h4 class="text-muted mt-3">No listings yet</h4>
            <p class="text-muted">Create a game listing to get started or wait for others to post.</p>
            <p class="text-muted small mt-4">
                <i class="bi bi-check-circle text-success me-1"></i> Application is running successfully!<br>
                <i class="bi bi-database text-primary me-1"></i> Database connected and seeded with test data.
            </p>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
