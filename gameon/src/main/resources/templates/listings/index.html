<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/layout :: head('Listings')}"></head>
<body class="bg-light">
    <nav th:replace="~{fragments/layout :: navbar('listings')}"></nav>
    <div th:replace="~{fragments/layout :: tabs('listings')}"></div>

    <div class="container mt-4">
        <!-- Header + Create Button -->
        <div class="d-flex justify-content-between align-items-center mb-3">
            <h4>Available Game Listings</h4>
            <a th:href="@{/listings/create}" class="btn btn-gameon">
                <i class="bi bi-plus-lg me-1"></i>Create Listing
            </a>
        </div>

        <!-- Flash Messages -->
        <div th:if="${success}" class="alert alert-success alert-dismissible fade show" role="alert">
            <span th:text="${success}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>
        <div th:if="${error}" class="alert alert-danger alert-dismissible fade show" role="alert">
            <span th:text="${error}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>

        <!-- Skill Filter -->
        <div class="mb-3">
            <form th:action="@{/listings}" method="get" class="d-flex gap-2 align-items-center">
                <label class="form-label mb-0 small text-muted">Filter:</label>
                <select name="skill" class="form-select form-select-sm" style="width: auto;" onchange="this.form.submit()">
                    <option value="">All Levels</option>
                    <option th:each="level : ${skillLevels}" th:value="${level}" th:text="${level}"
                            th:selected="${selectedSkill != null && selectedSkill.toUpperCase() == level.name()}">Level</option>
                </select>
            </form>
        </div>

        <!-- Listings Grid -->
        <div th:if="${listings != null && !listings.isEmpty()}" class="row g-3">
            <div th:each="listing : ${listings}" class="col-md-6 col-lg-4">
                <div class="card h-100 shadow-sm">
                    <div class="card-body">
                        <div class="d-flex justify-content-between align-items-start mb-2">
                            <h6 class="card-title mb-0" th:text="${listing.format.sport.sportName}">Sport</h6>
                            <span class="badge badge-skill"
                                  th:classappend="${listing.skillLevel.name() == 'BEGINNER'} ? 'bg-success' : (${listing.skillLevel.name() == 'INTERMEDIATE'} ? 'bg-warning text-dark' : 'bg-danger')"
                                  th:text="${listing.skillLevel}">Level</span>
                        </div>
                        <p class="text-muted small mb-1">
                            <i class="bi bi-controller me-1"></i>
                            <span th:text="${listing.format.formatName}">Format</span>
                            (<span th:text="${listing.format.noPlayers}">0</span> players)
                        </p>
                        <p class="text-muted small mb-1">
                            <i class="bi bi-calendar me-1"></i>
                            <span th:text="${#temporals.format(listing.scheduledDate, 'dd MMM yyyy HH:mm')}">Date</span>
                        </p>
                        <p class="text-muted small mb-2">
                            <i class="bi bi-geo-alt me-1"></i>
                            <span th:text="${listing.location}">Location</span>
                        </p>
                        <p class="small mb-2">
                            <i class="bi bi-person me-1"></i>
                            Created by <strong th:text="${listing.creator.username}">User</strong>
                        </p>
                    </div>
                    <div class="card-footer bg-white border-top-0">
                        <a th:href="@{'/listings/' + ${listing.gameListingId}}" class="btn btn-outline-gameon btn-sm w-100">
                            View Teams &amp; Join
                        </a>
                    </div>
                </div>
            </div>
        </div>

        <!-- Empty State -->
        <div th:if="${listings == null || listings.isEmpty()}" class="text-center py-5">
            <i class="bi bi-trophy text-muted" style="font-size: 4rem;"></i>
            <h5 class="text-muted mt-3">No listings available</h5>
            <p class="text-muted">Create a game listing or add more sports to your profile to see listings.</p>
        </div>

        <!-- Pagination -->
        <nav th:if="${listings != null && listings.totalPages > 1}" class="mt-4">
            <ul class="pagination justify-content-center">
                <li class="page-item" th:classappend="${listings.first} ? 'disabled'">
                    <a class="page-link" th:href="@{/listings(page=${listings.number - 1}, skill=${selectedSkill})}">Previous</a>
                </li>
                <li th:each="i : ${#numbers.sequence(0, listings.totalPages - 1)}"
                    class="page-item" th:classappend="${i == listings.number} ? 'active'">
                    <a class="page-link" th:href="@{/listings(page=${i}, skill=${selectedSkill})}" th:text="${i + 1}">1</a>
                </li>
                <li class="page-item" th:classappend="${listings.last} ? 'disabled'">
                    <a class="page-link" th:href="@{/listings(page=${listings.number + 1}, skill=${selectedSkill})}">Next</a>
                </li>
            </ul>
        </nav>
    </div>

    <div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
