# ============================================================
# GameOn - Test Profile
# Use: Unit and integration tests (H2 in-memory database)
# Activate: @ActiveProfiles("test") on test classes
# ============================================================

# ===== H2 In-Memory Database =====
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=MSSQLServer
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

# ===== JPA =====
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

# ===== Flyway (disabled for tests - Hibernate auto-creates schema) =====
spring.flyway.enabled=false

# ===== Thymeleaf =====
spring.thymeleaf.cache=false

# ===== Logging =====
logging.level.com.gameon=DEBUG
logging.level.org.springframework.security=DEBUG
logging.level.org.hibernate.SQL=DEBUG
