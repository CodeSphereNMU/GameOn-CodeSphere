# ============================================================
# GameOn - Development Profile
# Use: Local development against SQL Server (GameOnDb)
# Activate: --spring.profiles.active=dev or set SPRING_PROFILES_ACTIVE=dev
# ============================================================

# ===== Database (override for local dev if needed) =====
spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=GameOnDb;encrypt=true;trustServerCertificate=true
spring.datasource.username=gameon_user
spring.datasource.password=${DB_PASSWORD:GameOn2026!}

# ===== JPA =====
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.generate_statistics=true

# ===== Flyway =====
spring.flyway.enabled=true

# ===== Thymeleaf =====
spring.thymeleaf.cache=false

# ===== Logging (verbose for debugging) =====
logging.level.com.gameon=DEBUG
logging.level.org.springframework.security=DEBUG
logging.level.org.springframework.web=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# ===== DevTools =====
spring.devtools.restart.enabled=true
spring.devtools.livereload.enabled=true
